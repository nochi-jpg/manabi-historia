*{box-sizing:border-box;margin:0}
body{background:#111;color:#fff;font-family:"ZKG",sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 6px}p.lead{color:#bbb;font-size:14px;margin-bottom:16px}
.cand{max-width:1100px;margin:0 auto 28px}.cand h2{font-size:17px;margin-bottom:6px}.cand .note{color:#bbb;font-size:13px;margin-bottom:8px;line-height:1.6}
.view{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden}
.bg,.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg svg{filter:hue-rotate(230deg) saturate(1.3) brightness(.7)}
/* ---- 共通の配置（すき間なし：画面のはしに くっつける） ---- */
.hud{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:stretch}
.hearts{display:flex;align-items:center;gap:4px;padding:0 22px}
.heart{width:34px;height:30px}
.eptitle{flex:1;display:flex;align-items:center;padding:0 24px;font-size:28px}
.hb{width:170px;display:flex;align-items:center;justify-content:center;font-size:26px}
.ribbon{position:absolute;left:0;top:76px;height:64px;display:flex;align-items:center;padding:0 40px 0 28px;font-size:30px}
.witness{position:absolute;right:0;top:76px;width:560px;height:520px;display:flex;align-items:center;justify-content:center;font-size:300px}
.witness .face{width:440px;height:440px;display:flex;align-items:center;justify-content:center}
.side{position:absolute;right:0;bottom:250px;display:flex;flex-direction:column}
.nav{position:absolute;left:300px;right:0;bottom:250px;height:84px;display:flex}
.nav .b{flex:1;display:flex;align-items:center;justify-content:center;font-size:32px}
.tbox{position:absolute;left:0;right:0;bottom:0;height:250px;padding:58px 64px 0 64px;font-size:40px;line-height:1.65}
.tname{position:absolute;left:0;top:-84px;height:84px;width:300px;display:flex;align-items:center;justify-content:center;font-size:36px}
.tcount{position:absolute;right:30px;bottom:20px;font-size:26px}
.speak{position:absolute;right:30px;top:40px;width:76px;height:76px;display:flex;align-items:center;justify-content:center;font-size:34px}
.shout{position:absolute;left:50%;top:330px;transform:translate(-50%,-50%) rotate(-6deg);font-size:150px;white-space:nowrap}

/* ===== A：法廷ネイビー（逆転裁判よりの 重厚さ） ===== */
.A .hud{background:linear-gradient(#0d1530,#0a1026);border-bottom:4px solid #c9a24a}
.A .hearts{background:#060b1d;border-right:4px solid #c9a24a}
.A .eptitle{font-family:"DGO";color:#f4e2a8;letter-spacing:.06em}
.A .hb{background:linear-gradient(#1d2a55,#121b3d);border-left:4px solid #c9a24a;font-family:"ZKG";font-weight:700;color:#fff}
.A .ribbon{background:linear-gradient(90deg,#b8862b,#e9c46a 70%,transparent);color:#1a1205;font-family:"DGO";clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}
.A .witness .face{background:radial-gradient(circle at 50% 40%,#5a6aa0,#1b2448);border:8px solid #c9a24a;box-shadow:0 0 0 6px #0a1026,0 0 60px 10px #9b4dff}
.A .nav .b{background:linear-gradient(#24356e,#141f45);border-top:4px solid #c9a24a;border-right:3px solid #0a1026;font-family:"ZKG";font-weight:700;color:#fff}
.A .nav .b.red{background:linear-gradient(#e0433b,#9e1f1a);font-family:"DGO";color:#fff}
.A .tbox{background:linear-gradient(rgba(10,18,48,.94),rgba(6,10,30,.97));border-top:5px solid #c9a24a;font-family:"ZKG";font-weight:700;color:#fff}
.A .tname{background:#e07a1f;color:#fff;font-family:"DGO";border:4px solid #c9a24a;border-left:0;border-bottom:0}
.A .tcount{color:#e9c46a;font-family:"DGO"}
.A .speak{border:4px solid #c9a24a;background:#141f45;border-radius:50%}
.A .shout{font-family:"DGO";color:#ff3b30;-webkit-text-stroke:10px #fff;paint-order:stroke;text-shadow:0 10px 0 #0a1026}

/* ===== B：墨と朱（歴史らしい 和の重み） ===== */
.B .hud{background:#1b1714;border-bottom:4px solid #b8322a}
.B .hearts{background:#100d0b;border-right:2px solid #6b5a45}
.B .eptitle{font-family:"SMB";color:#f1e6cf;font-size:32px;letter-spacing:.12em}
.B .hb{background:#2a2420;border-left:2px solid #6b5a45;font-family:"SMB";color:#f1e6cf}
.B .ribbon{background:#b8322a;color:#fff;font-family:"SMB";letter-spacing:.15em;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%)}
.B .witness .face{background:radial-gradient(circle at 50% 40%,#6b5a45,#241d18);border:10px solid #1b1714;outline:4px solid #b8322a;box-shadow:0 0 60px 10px #9b4dff}
.B .nav .b{background:linear-gradient(#f1e6cf,#d9c9a6);color:#1b1714;border-top:4px solid #1b1714;border-right:2px solid #6b5a45;font-family:"SMB"}
.B .nav .b.red{background:#b8322a;color:#fff}
.B .tbox{background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px),linear-gradient(#f4ead2,#e7d8b5);border-top:6px solid #1b1714;color:#1b1714;font-family:"ZKG";font-weight:700}
.B .tname{background:#1b1714;color:#f1e6cf;font-family:"SMB";letter-spacing:.1em}
.B .tcount{color:#b8322a;font-family:"SMB"}
.B .speak{border:4px solid #1b1714;background:#f1e6cf;color:#1b1714;border-radius:50%}
.B .shout{font-family:"SMB";color:#b8322a;-webkit-text-stroke:10px #f4ead2;paint-order:stroke;text-shadow:0 8px 0 #1b1714}

/* ===== C：時空ネオン（トケイと時間旅行の SF感） ===== */
.C .hud{background:linear-gradient(90deg,#120a26,#1d1140);border-bottom:3px solid #35e0d0;box-shadow:0 2px 16px rgba(53,224,208,.5)}
.C .hearts{background:#0b0618;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);padding-right:44px}
.C .eptitle{font-family:"RNR";color:#e6fbff;text-shadow:0 0 12px #35e0d0}
.C .hb{background:#24164d;font-family:"RNR";color:#e6fbff;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);margin-left:-14px}
.C .ribbon{background:linear-gradient(90deg,#35e0d0,#7b5cff);color:#0b0618;font-family:"RNR";clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.C .witness .face{background:radial-gradient(circle at 50% 40%,#3c2a7a,#120a26);border:4px solid #35e0d0;clip-path:polygon(10% 0,100% 0,100% 90%,90% 100%,0 100%,0 10%);box-shadow:inset 0 0 60px #9b4dff}
.C .nav .b{background:linear-gradient(#2b1b5c,#170d33);border-top:3px solid #35e0d0;font-family:"RNR";color:#e6fbff}
.C .nav .b.red{background:linear-gradient(#ff3d81,#b0124f);color:#fff}
.C .tbox{background:linear-gradient(rgba(20,10,44,.93),rgba(10,5,24,.97));border-top:3px solid #35e0d0;font-family:"ZMG";font-weight:700;color:#e6fbff}
.C .tname{background:linear-gradient(90deg,#35e0d0,#7b5cff);color:#0b0618;font-family:"RNR";clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
.C .tcount{color:#35e0d0;font-family:"RNR"}
.C .speak{border:3px solid #35e0d0;background:#170d33;border-radius:50%}
.C .shout{font-family:"RNR";color:#ff3d81;-webkit-text-stroke:10px #0b0618;paint-order:stroke;text-shadow:0 0 30px #ff3d81}
</style></head><body>
<h1>UIの候補（議論パートの画面）</h1>
<p class="lead">同じ場面を3つのデザインで並べています。どれも画面のはしまで部品をつめて、すき間をなくしています。「矛盾はっけん！」の文字は、つきつけた瞬間に出る演出の見本です。</p>
<div id="root"></div>
<script>/* 影絵背景（すべてコードで描く） */
const BG = (() => {
  const NS = "http://www.w3.org/2000/svg", W = 1600, H = 900;
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  function sky(svg, id, stops) {
    const d = el("defs", {}, svg); const g = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, d);
    stops.forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, g));
    el("rect", { width: W, height: H, fill: `url(#${id})` }, svg); return d;
  }
  function glow(defs, id, color) { const g = el("radialGradient", { id }, defs); el("stop", { offset: 0, "stop-color": color, "stop-opacity": .9 }, g); el("stop", { offset: 1, "stop-color": color, "stop-opacity": 0 }, g); }
  function person(p, x, y, s, fill, spear) {
    const g = el("g", { transform: `translate(${x},${y}) scale(${s})`, fill }, p);
    el("circle", { cx: 0, cy: -118, r: 14 }, g);
    el("path", { d: "M-14-100 Q0-108 14-100 L20-50 L12-50 L10 0 L2 0 L0-40 L-2 0 L-10 0 L-12-50 L-20-50Z" }, g);
    if (spear) el("path", { d: "M18-96 L70-170 L74-167 L22-93Z M70-170 L82-186 L76-166Z" }, g);
  }
  const scenes = {
    縄文: { ground: "#3d1f12", draw(svg) {
      const d = sky(svg, "skyJ", [[0, "#f08a4b"], [.55, "#f7c376"], [1, "#fbe7b5"]]);
      glow(d, "sunJ", "#fff4cf"); glow(d, "fireJ", "#ffb347");
      el("circle", { cx: 1150, cy: 520, r: 260, fill: "url(#sunJ)" }, svg);
      el("circle", { cx: 1150, cy: 520, r: 90, fill: "#fff1c9" }, svg);
      el("path", { d: "M0 560 Q220 450 440 530 T880 500 T1300 470 T1600 520 V900 H0Z", fill: "#d58a57", opacity: .75 }, svg);
      const f = el("g", { fill: "#9a5634" }, svg);
      el("path", { d: "M0 640 Q400 600 800 630 T1600 610 V900 H0Z" }, f);
      for (let x = -20; x < 1640; x += 38 + rnd() * 30) { const h = 90 + rnd() * 110, w = 40 + rnd() * 30, y = 630 - rnd() * 20;
        el("path", { d: `M${x} ${y} Q${x - w * .6} ${y - h * .5} ${x} ${y - h} Q${x + w * .6} ${y - h * .5} ${x} ${y}Z` }, f); }
      const n = el("g", { fill: "#3d1f12" }, svg);
      el("path", { d: "M0 760 Q300 700 640 730 T1200 720 T1600 740 V900 H0Z" }, n);
      el("path", { d: "M1320 735 Q1400 660 1500 735Z" }, n);
      const hut = (x, y, s) => { const g = el("g", { transform: `translate(${x},${y}) scale(${s})` }, n);
        el("path", { d: "M-120 0 Q-80-70-12-160 L12-160 Q80-70 120 0Z" }, g);
        el("path", { d: "M-20-150 L-40-195 M20-150 L40-195 M-6-160 L-14-200 M6-160 L14-200", stroke: "#3d1f12", "stroke-width": 6 }, g);
        el("path", { d: "M-24 0 L-24-40 Q0-56 24-40 L24 0Z", fill: "#f7c376", opacity: .35 }, g); };
      hut(330, 735, 1); hut(620, 728, .8); hut(900, 740, 1.1);
      el("path", { d: "M900 545 q-20-40 10-80 t0-90", stroke: "#fff", fill: "none", "stroke-width": 10, opacity: .35, "stroke-linecap": "round" }, svg);
      el("circle", { cx: 760, cy: 745, r: 80, fill: "url(#fireJ)" }, svg);
      el("path", { d: "M745 750 Q750 715 760 700 Q770 715 775 750Z", fill: "#ffcf6b" }, svg);
      person(n, 140, 760, 1, "#3d1f12", true);
    } },
    江戸: { ground: "#0a1122", draw(svg) {
      const d = sky(svg, "skyE", [[0, "#0f1a36"], [.6, "#34508a"], [1, "#8fa8d4"]]);
      glow(d, "lanE", "#ffb04a"); glow(d, "moonE", "#f6efd6");
      el("circle", { cx: 1460, cy: 300, r: 160, fill: "url(#moonE)", opacity: .6 }, svg);
      el("circle", { cx: 1460, cy: 300, r: 58, fill: "#f6efd6" }, svg);
      for (let i = 0; i < 40; i++) el("circle", { cx: rnd() * W, cy: 120 + rnd() * 380, r: 1 + rnd() * 1.8, fill: "#fff", opacity: .5 + rnd() * .5 }, svg);
      el("path", { d: "M380 600 L700 330 Q740 300 780 330 L1100 600Z", fill: "#4a6699" }, svg);
      el("path", { d: "M640 380 L700 330 Q740 300 780 330 L840 380 L800 372 L770 392 L740 370 L705 392 L680 372Z", fill: "#dfe7f5" }, svg);
      const c = el("g", { fill: "#1d2c52" }, svg);
      el("path", { d: "M0 660 Q400 630 800 650 T1600 640 V900 H0Z" }, c);
      el("path", { d: "M1040 660 L1080 560 L1320 560 L1360 660Z" }, c);
      const tier = (cx, y, w) => { el("rect", { x: cx - w / 2, y: y - 60, width: w, height: 60 }, c);
        el("path", { d: `M${cx - w / 2 - 40} ${y - 55} Q${cx - w / 2 - 10} ${y - 62} ${cx - w / 2 + 5} ${y - 90} L${cx + w / 2 - 5} ${y - 90} Q${cx + w / 2 + 10} ${y - 62} ${cx + w / 2 + 40} ${y - 55}Z` }, c); };
      tier(1200, 560, 200); tier(1200, 470, 150); tier(1200, 380, 100);
      el("path", { d: "M1160 290 L1180 270 L1220 270 L1240 290Z" }, c);
      const n = el("g", { fill: "#0a1122" }, svg);
      el("rect", { x: 0, y: 760, width: W, height: 140 }, n);
      let x = -10; while (x < W) { const w = 110 + rnd() * 80, h = 60 + rnd() * 40;
        el("rect", { x, y: 760 - h, width: w, height: h }, n);
        el("path", { d: `M${x - 12} ${760 - h + 4} L${x + w / 2} ${760 - h - 42} L${x + w + 12} ${760 - h + 4}Z` }, n);
        if (rnd() > .4) { const lx = x + w * .3; el("circle", { cx: lx, cy: 740, r: 46, fill: "url(#lanE)" }, svg);
          el("rect", { x: lx - 9, y: 726, width: 18, height: 28, rx: 8, fill: "#ffc76b" }, svg); }
        x += w + 6; }
    } },
    現代: { ground: "#170c22", draw(svg) {
      const d = sky(svg, "skyM", [[0, "#2a1b4f"], [.5, "#b8507a"], [1, "#f7b26a"]]);
      glow(d, "sunM", "#ffd9a0");
      el("circle", { cx: 420, cy: 600, r: 280, fill: "url(#sunM)" }, svg);
      el("circle", { cx: 420, cy: 600, r: 100, fill: "#ffe2b5" }, svg);
      const f = el("g", { fill: "#8a4a7c", opacity: .75 }, svg);
      let x = 0; while (x < W) { const w = 50 + rnd() * 70, h = 120 + rnd() * 220; el("rect", { x, y: 640 - h, width: w, height: h + 10 }, f); x += w + 4; }
      const t = el("g", { fill: "#4a2758" }, svg);
      el("path", { d: "M1240 640 L1280 380 L1290 220 L1296 150 L1300 150 L1306 220 L1316 380 L1356 640 L1330 640 L1298 410 L1266 640Z" }, t);
      el("rect", { x: 1266, y: 350, width: 64, height: 26, rx: 6 }, t); el("rect", { x: 1278, y: 250, width: 40, height: 18, rx: 5 }, t);
      const m = el("g", { fill: "#3a2050" }, svg); x = -20;
      while (x < W) { const w = 90 + rnd() * 90, h = 140 + rnd() * 170;
        if (x < 1200 || x > 1380) { el("rect", { x, y: 720 - h, width: w, height: h + 10 }, m);
          for (let wy = 720 - h + 16; wy < 700; wy += 26) for (let wx = x + 12; wx < x + w - 14; wx += 22) if (rnd() > .6) el("rect", { x: wx, y: wy, width: 10, height: 12, fill: "#ffd479", opacity: .85 }, svg); }
        x += w + 14; }
      const n = el("g", { fill: "#170c22" }, svg);
      el("rect", { x: 0, y: 790, width: W, height: 110 }, n);
      el("rect", { x: 0, y: 690, width: W, height: 14 }, n);
      for (let px = 60; px < W; px += 220) el("rect", { x: px, y: 700, width: 18, height: 100 }, n);
      el("rect", { x: 700, y: 634, width: 620, height: 52, rx: 20 }, n);
      for (let wx = 730; wx < 1290; wx += 46) el("rect", { x: wx, y: 646, width: 28, height: 18, rx: 3, fill: "#ffe9a8", opacity: .9 }, svg);
      el("rect", { x: 180, y: 720, width: 420, height: 80 }, n);
      el("rect", { x: 350, y: 690, width: 80, height: 40 }, n);
      [140, 700, 1260].forEach(px => { el("rect", { x: px, y: 610, width: 10, height: 180 }, n); el("rect", { x: px - 24, y: 624, width: 58, height: 6 }, n); });
      el("path", { d: "M140 628 Q420 668 705 628 Q985 668 1265 628 Q1430 655 1600 640", stroke: "#170c22", "stroke-width": 3, fill: "none" }, svg);
    } },
    夜: { ground: "#05060c", draw(svg) { sky(svg, "skyN", [[0, "#05060c"], [1, "#1b1d33"]]);
      for (let i = 0; i < 60; i++) el("circle", { cx: rnd() * W, cy: rnd() * 700, r: .8 + rnd() * 1.6, fill: "#fff", opacity: .3 + rnd() * .5 }, svg); } },
    時空: { ground: "#120a26", draw(svg) {
      const d = el("defs", {}, svg); const g = el("radialGradient", { id: "warp", cx: .5, cy: .45, r: .8 }, d);
      [[0, "#fff6d6"], [.15, "#b98cff"], [.5, "#3b1d7a"], [1, "#0b0620"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, g));
      el("rect", { width: W, height: H, fill: "url(#warp)" }, svg);
      for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; el("path", { d: `M800 400 L${800 + Math.cos(a) * 1200} ${400 + Math.sin(a) * 1200}`, stroke: "#fff", "stroke-width": 2 + rnd() * 3, opacity: .15 + rnd() * .2 }, svg); }
    } },
  };
  function render(key) {
    seed = 7;
    const sc = scenes[key] || scenes["夜"];
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "xMidYMid slice" });
    sc.draw(svg);
    // セリフ枠に隠れないよう、景色を上へずらす（空はそのまま）
    if (key !== "夜" && key !== "時空") {
      const g = el("g", { transform: "translate(0,-120)" });
      [...svg.childNodes].slice(2).forEach(c => g.appendChild(c)); svg.appendChild(g);
      el("rect", { x: 0, y: H - 130, width: W, height: 130, fill: sc.ground }, svg);
    }
    return svg;
  }
  return { render, keys: Object.keys(scenes) };
})();
</script>
<script>
const C=[["A","A：法廷ネイビー","逆転裁判にいちばん近い。紺と金で重みのある画面。見出しや「矛盾はっけん！」は太くて力強い字（Dela Gothic One）。"],
["B","B：墨と朱","歴史ものらしい和風。墨色と朱色、和紙のようなセリフ枠。見出しは明朝体（しっぽり明朝）で、時代劇のような雰囲気。"],
["C","C：時空ネオン","トケイと時間旅行のSF感。紫と水色の光るライン、ななめに切った部品。見出しはロックンロール（RocknRoll One）。"]];
const heart='<svg class="heart" viewBox="0 0 24 22"><path d="M12 21 C-6 9 4-4 12 4 C20-4 30 9 12 21Z" fill="#ff3b5c" stroke="#fff" stroke-width="1.6"/></svg>';
const heartE='<svg class="heart" viewBox="0 0 24 22"><path d="M12 21 C-6 9 4-4 12 4 C20-4 30 9 12 21Z" fill="#333" stroke="#888" stroke-width="1.6"/></svg>';
const root=document.getElementById('root');
C.forEach(([k,t,n])=>{const d=document.createElement('div');d.className='cand';
d.innerHTML=`<h2>${t}</h2><div class="note">${n}</div><div class="view"><div class="stage ${k}"><div class="bg"></div>
<div class="hud"><div class="hearts">${heart.repeat(4)+heartE}</div><div class="eptitle">第1話　縄文のむら</div><div class="hb">カード</div><div class="hb">ヒント</div><div class="hb">ちゅうだん</div></div>
<div class="ribbon">証言「むらの くらし」　2 / 3</div>
<div class="witness"><div class="face">👧</div></div>
<div class="nav"><div class="b">◀ 前へ</div><div class="b red">つきつける！</div><div class="b">次へ ▶</div></div>
<div class="tbox"><div class="tname">ミナ</div>食べ物は、となりの むらから<br>お金を はらって 買うのよ。<div class="speak">🔊</div><div class="tcount">2 / 3</div></div>
<div class="shout">矛盾はっけん！</div>
</div></div>`;root.appendChild(d);
d.querySelector('.bg').appendChild(BG.render('縄文'));});
const fit=()=>document.querySelectorAll('.view').forEach(v=>{v.firstChild.style.transform=`scale(${v.clientWidth/1600})`;});
addEventListener('resize',fit);fit();
</script></body></html>
