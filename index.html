/* ===== まなびヒストリア UI「墨と朱」 =====
   墨色の帯・朱色のアクセント・和紙のセリフ枠。部品は画面のはしまでつめて、すき間をつくらない。
   見出し：しっぽり明朝 B1（Mincho）／本文：Zen角ゴシック New（Gothic）。どちらも OFL。 */
:root{
  --sumi:#1b1714; --sumi2:#2a2420; --sumi3:#100d0b; --line:#6b5a45;
  --shu:#b8322a; --shu2:#8e211b; --washi:#f4ead2; --washi2:#e2d2ad; --kin:#c9a24a;
  --ink:#1b1714; --ink2:#6b5a45;
  --hud:76px; --bar:84px; --box:250px;
  --card-w:150px; --card-h:196px;
  --mincho:"Mincho","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Gothic","Zen Kaku Gothic New","BIZ UDPGothic","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:var(--gothic);font-weight:700;color:var(--ink);-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:var(--sumi3)}
#bg,#bg svg{position:absolute;inset:0;width:100%;height:100%}
#layer{position:absolute;inset:0}
button{font-family:inherit;font-weight:700;cursor:pointer;color:inherit}
[hidden]{display:none!important}

/* ---------- ボタン（和紙の札／朱の札） ---------- */
.btn{height:var(--bar);min-width:220px;padding:0 32px;border:0;border-radius:0;background:linear-gradient(var(--washi),var(--washi2));color:var(--ink);
  font-family:var(--mincho);font-size:32px;white-space:nowrap;box-shadow:inset 0 0 0 4px var(--sumi),inset 0 -6px 0 rgba(0,0,0,.12);transition:filter .1s,transform .08s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.sub{background:linear-gradient(#3a322c,var(--sumi2));color:var(--washi);box-shadow:inset 0 0 0 4px var(--line)}
.btn.red{background:linear-gradient(#cf3b31,var(--shu2));color:#fff;box-shadow:inset 0 0 0 4px var(--sumi),inset 0 -6px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.4;cursor:default}
.btnrow{display:flex;gap:0;justify-content:center}
.btnrow .btn{width:340px}

/* ---------- 上の帯（HUD） ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:var(--hud);display:flex;align-items:stretch;z-index:20;background:var(--sumi);border-bottom:4px solid var(--shu)}
#hearts{display:flex;align-items:center;gap:4px;padding:0 22px;background:var(--sumi3);border-right:2px solid var(--line)}
.heart{width:34px;height:30px;display:block}
#eptitle{flex:1;display:flex;align-items:center;padding:0 28px;font-family:var(--mincho);font-size:32px;letter-spacing:.12em;color:var(--washi)}
.hudbtn{width:170px;border:0;border-left:2px solid var(--line);background:var(--sumi2);color:var(--washi);font-family:var(--mincho);font-size:26px}
.hudbtn:hover:not(:disabled){background:#3a322c}
.hudbtn:disabled{color:#8a7a66;cursor:default}

/* ---------- 朱のリボン（案内・証言のタイトル） ---------- */
.guide{position:absolute;left:0;top:var(--hud);height:64px;display:flex;align-items:center;padding:0 64px 0 28px;background:var(--shu);color:#fff;
  font-family:var(--mincho);font-size:30px;letter-spacing:.1em;white-space:nowrap;z-index:5;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 50%,100% 100%,0 100%)}

/* ---------- 顔グラ（スキット風の正方形） ---------- */
.port{position:absolute;bottom:calc(var(--box) + 76px);width:300px;height:300px;z-index:8;transition:opacity .2s,filter .2s}
#portL{left:0} #portR{right:0}
.port.dim{opacity:.55;filter:brightness(.7)}
.pface{width:300px;height:300px;background:radial-gradient(circle at 50% 38%,var(--c),var(--sumi2));border:8px solid var(--sumi);outline:4px solid var(--shu);outline-offset:-12px;
  display:flex;align-items:center;justify-content:center;font-size:190px}
.pname{display:none}
.pexpr{position:absolute;top:6px;right:10px;font-size:64px}

/* ---------- セリフ枠（和紙） ---------- */
#catch{position:absolute;inset:0;z-index:30}
#talk{position:absolute;left:0;right:0;bottom:0;height:var(--box);z-index:31;cursor:pointer;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 2px,transparent 2px 6px),linear-gradient(var(--washi),var(--washi2));border-top:6px solid var(--sumi);padding:52px 140px 0 64px}
#talk.dark{background:linear-gradient(#1f1a26,#120e17);border-top-color:#8f7bb8;color:#e8e0f4}
.tname{position:absolute;left:0;top:-70px;height:64px;min-width:300px;padding:0 40px;display:flex;align-items:center;justify-content:center;
  background:var(--sumi);color:var(--washi);font-family:var(--mincho);font-size:34px;letter-spacing:.12em;border-top:4px solid var(--shu)}
.ttext{font-size:40px;line-height:1.65}
.ttext.narr{color:#4a3f33}
#talk.dark .ttext.narr{color:#d8cfee}
.speak{position:absolute;right:34px;top:34px;width:80px;height:80px;border-radius:50%;border:4px solid var(--sumi);background:var(--washi);font-size:34px}
.next{position:absolute;right:52px;bottom:20px;font-size:28px;color:var(--shu);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(6px)}}
ruby rt{font-size:.45em;font-family:var(--gothic)}
.kw{color:var(--shu);font-weight:900}
#talk.dark .kw{color:#ff9a8a}

/* ---------- 調べる場面の小物 ---------- */
.prop{position:absolute;width:160px;height:160px;transform:translate(-50%,-50%);border:0;background:rgba(244,234,210,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:inset 0 0 0 4px var(--sumi),0 6px 0 rgba(0,0,0,.35);transition:transform .12s}
.prop:hover{transform:translate(-50%,-50%) scale(1.05)}
.picon{font-size:80px;line-height:1}
.plabel{height:36px;line-height:36px;padding:0 12px;background:var(--sumi);color:var(--washi);font-family:var(--mincho);font-size:21px;white-space:nowrap}
.prop.done{opacity:.6}
.prop.done::after,.prop.checked::after{content:"済";position:absolute;top:-12px;right:-12px;width:48px;height:48px;background:var(--shu);color:#fff;font-family:var(--mincho);font-size:28px;line-height:48px;text-align:center;transform:rotate(12deg)}
.sil{width:96px;height:112px;color:var(--sumi);fill:currentColor}
.sil .eyes{opacity:0}

/* ---------- カード（和紙の札） ---------- */
.card{width:var(--card-w);height:var(--card-h);flex:0 0 auto;border:0;background:linear-gradient(var(--washi),var(--washi2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;
  box-shadow:inset 0 0 0 4px var(--sumi),inset 0 0 0 8px var(--washi),inset 0 0 0 10px var(--kin);transition:transform .1s}
.card:hover{filter:brightness(1.06)}
.cicon{font-size:72px;line-height:1;height:84px;display:flex;align-items:center}
.cname{height:56px;display:flex;align-items:center;text-align:center;font-family:var(--mincho);font-size:21px;line-height:1.25}
.card.large{--card-w:220px;--card-h:288px}.card.large .cicon{font-size:110px;height:120px}.card.large .cname{font-size:28px}
.card.unknown{background:#4a4038;color:#9a8a76;box-shadow:inset 0 0 0 4px var(--sumi)}
.card.sel{box-shadow:inset 0 0 0 4px var(--sumi),inset 0 0 0 8px var(--washi),inset 0 0 0 13px var(--shu);transform:translateY(-6px)}
.card.blank{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 3px rgba(244,234,210,.2)}
.inbox .card.blank{background:rgba(0,0,0,.06);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}

/* ---------- ページ送り ---------- */
.pager{display:flex;flex-direction:column;align-items:center;gap:10px}
.pg-row{display:flex;align-items:stretch;gap:12px}
.pg-grid{display:grid;gap:12px}
.pg-arrow{width:72px;border:0;background:var(--shu);color:#fff;font-size:34px;box-shadow:inset 0 0 0 4px var(--sumi)}
.pg-arrow:disabled{background:var(--sumi2);color:#5a4e42;cursor:default}
.pg-dots{height:16px;display:flex;gap:12px}
.dot{width:14px;height:14px;transform:rotate(45deg);background:#5a4e42}
.dot.on{background:var(--shu)}

/* ---------- モーダル ---------- */
.modal{position:absolute;inset:0;z-index:40;background:rgba(10,8,6,.6);display:flex;align-items:center;justify-content:center}
.modal.bottom{align-items:flex-end}
.inbox,.cardget{min-width:800px;max-width:1200px;background:linear-gradient(var(--washi),var(--washi2));border-top:8px solid var(--shu);box-shadow:inset 0 0 0 4px var(--sumi);
  padding:44px 56px 0;text-align:center;font-size:30px;line-height:1.6}
.inbox>.btn,.cardget>.btn{display:flex;align-items:center;justify-content:center;margin:28px -56px 0;width:calc(100% + 112px)}
.inbox>.btnrow{margin:28px -56px 0}
.inbox>.btnrow .btn{flex:1;width:auto}
.in-title,.cg-title{font-family:var(--mincho);font-size:36px;margin-bottom:18px}
.in-msg{font-size:30px}
.inbox input{width:100%;height:88px;font-size:40px;text-align:center;border:4px solid var(--sumi);background:#fffaf0;font-family:var(--gothic)}
.cardget .card{margin:0 auto 20px}
.cg-desc{font-size:28px;margin-bottom:12px}
.cg-kw{font-size:24px;color:var(--ink2);margin-top:6px}
.inbox.wide{width:1600px;max-width:1600px;min-width:0;padding:36px 32px 0}
.inbox.wide>.btn{margin:20px -32px 0;width:calc(100% + 64px)}
.hv-detail{min-height:120px;font-size:28px;text-align:left;background:#fffaf0;box-shadow:inset 0 0 0 3px var(--line);padding:16px 24px;margin-top:14px}

/* カード選択（下の帯） */
.hand{width:100%;background:var(--sumi);border-top:6px solid var(--shu);padding:0;text-align:center}
.hand-quote{display:block;margin:0;padding:14px 40px;background:linear-gradient(var(--washi),var(--washi2));font-size:30px;line-height:1.5;text-align:left}
.hand-quote b{font-family:var(--mincho);color:var(--shu);margin-right:10px}
.hand-title{color:var(--washi);font-family:var(--mincho);font-size:30px;letter-spacing:.08em;padding:14px 0}
.hand .pager{margin-bottom:14px}
.hand-detail{min-height:92px;text-align:left;background:linear-gradient(var(--washi),var(--washi2));padding:14px 40px;font-size:28px;line-height:1.5;border-top:4px solid var(--kin)}
.hand .btnrow .btn{flex:1;width:auto;height:var(--bar)}

/* ---------- 議論パート ---------- */
.witness{position:absolute;right:0;top:var(--hud);width:520px;bottom:calc(var(--box) + var(--bar) + 6px);display:flex;align-items:center;justify-content:center}
.w-face{width:440px;height:440px;background:radial-gradient(circle at 50% 38%,var(--c),var(--sumi2));border:10px solid var(--sumi);outline:4px solid var(--shu);outline-offset:-14px;display:flex;align-items:center;justify-content:center;font-size:280px}
.w-name{display:none}
.tbox{position:absolute;left:0;right:0;bottom:0;height:var(--box);padding:52px 140px 0 64px;z-index:6;cursor:pointer;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 2px,transparent 2px 6px),linear-gradient(var(--washi),var(--washi2));border-top:6px solid var(--sumi)}
.tbox .tname{top:calc(-1 * var(--bar) - 6px);height:var(--bar);width:300px;min-width:0}
.tbox .tcount{position:absolute;right:40px;bottom:18px;font-family:var(--mincho);font-size:28px;color:var(--shu)}
.tbox.flip .ttext{animation:fade .35s}
.tnav{position:absolute;left:300px;right:0;bottom:calc(var(--box) + 6px);height:var(--bar);display:flex;z-index:6}
.tnav .btn{flex:1;width:auto;min-width:0}
.tbox.suspect{background:linear-gradient(#fff3c4,#f4dc8a)}
.tbox.suspect::before,.claim.suspect::before{content:"あやしい";position:absolute;top:0;right:140px;height:44px;line-height:44px;padding:0 20px;background:var(--shu);color:#fff;font-family:var(--mincho);font-size:24px}

/* ---------- 論破バトル ---------- */
#layer.battle .guide{z-index:7}
.foe{position:absolute;right:0;top:var(--hud);width:520px;bottom:0;background:rgba(16,13,11,.8);border-left:4px solid var(--shu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.foe-face{width:380px;height:380px;background:radial-gradient(circle at 50% 40%,#5b3f86,#1b1226);border:10px solid var(--sumi);outline:4px solid #9b6fd1;outline-offset:-14px;display:flex;align-items:center;justify-content:center;font-size:220px;box-shadow:0 0 60px #6b3fb0}
.foe-name{color:var(--washi);font-family:var(--mincho);font-size:36px;letter-spacing:.15em}
.gauge{display:flex;width:380px}
.seg{flex:1;height:30px;background:var(--shu);box-shadow:inset 0 0 0 3px var(--sumi)}
.seg.off{background:#3a322c}
.claims{position:absolute;left:0;top:calc(var(--hud) + 64px);right:520px;bottom:0;display:flex;flex-direction:column}
.claim{flex:1;position:relative;text-align:left;padding:0 48px;font-size:36px;line-height:1.55;border:0;
  background:linear-gradient(var(--washi),var(--washi2));box-shadow:inset 0 0 0 3px var(--line);color:var(--ink)}
.claim:hover{background:linear-gradient(#fff8e6,var(--washi))}
.claim .q{color:var(--shu);font-family:var(--mincho)}
.claim.suspect{background:linear-gradient(#fff3c4,#f4dc8a)}

/* ---------- まとめ ---------- */
.paper{position:absolute;left:0;right:0;top:calc(var(--hud) + 64px);bottom:0;background:linear-gradient(var(--washi),var(--washi2));padding:90px 100px;font-size:42px;line-height:2.5}
.paper p{margin:0}
.slot{min-width:280px;height:80px;padding:0 24px;margin:0 6px;border:0;background:#fffaf0;box-shadow:inset 0 0 0 4px var(--shu);font-family:var(--mincho);font-size:36px;vertical-align:middle;color:var(--shu)}
.slot.ok{background:var(--sumi);color:var(--washi);box-shadow:none}

/* ---------- 記憶のかけら ---------- */
#layer.frag{background:#08060a}
.frag-head{position:absolute;top:110px;width:100%;text-align:center;color:#d8cfee;font-family:var(--mincho);font-size:48px;letter-spacing:.3em;animation:fade 1.2s}
.frag-pic{position:absolute;left:50%;top:210px;transform:translateX(-50%);width:760px;height:380px;border:4px solid #8f7bb8;background:#16121f;color:#d8cfee;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:100px;animation:fade 1.2s}
.frag-cap{font-family:var(--mincho);font-size:28px;margin-top:12px;letter-spacing:.1em}
@keyframes fade{from{opacity:0}}

/* ---------- 演出 ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-6deg);font-family:var(--mincho);font-size:120px;white-space:nowrap;
  -webkit-text-stroke:12px var(--washi);paint-order:stroke;text-shadow:0 10px 0 var(--sumi);animation:pop 1.4s forwards}
.big.good{color:var(--sumi)}
.big.ronpa{color:var(--shu);font-size:170px}
.big.bad{color:#5a4e42;font-size:150px}
@keyframes pop{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.12);opacity:1}80%{opacity:1}100%{opacity:0}}
.banner{position:absolute;left:0;right:0;top:40%;height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--sumi);border-top:6px solid var(--shu);border-bottom:6px solid var(--shu);
  color:var(--washi);font-family:var(--mincho);font-size:56px;letter-spacing:.2em;animation:pop2 1.8s forwards}
.banner.tall{height:auto;padding:22px 0;line-height:1.4}
@keyframes pop2{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
#stage.shake{animation:shk .35s}
@keyframes shk{20%{margin-left:-14px}40%{margin-left:14px}60%{margin-left:-8px}80%{margin-left:8px}}
.warpfx{position:absolute;inset:0;background:radial-gradient(circle,rgba(200,140,255,0) 0,rgba(140,60,220,.75) 70%);animation:warpin 2.2s forwards}
@keyframes warpin{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#bg.warped svg{filter:hue-rotate(230deg) saturate(1.3) brightness(.7)}
/* 紫のオーラ（ゆがめられたキーマン） */
.port.aura .pface,.witness.aura .w-face{outline-color:#b26bff;box-shadow:0 0 50px 14px #9b4dff;filter:saturate(.7) brightness(.85) hue-rotate(-20deg);animation:auraw 2.4s ease-in-out infinite}
@keyframes auraw{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-2deg) translateY(-6px)}}

/* ---------- メニュー画面 ---------- */
#layer.menu{display:flex;flex-direction:column;align-items:stretch}
.logo{position:absolute;left:0;right:0;top:0;height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(rgba(16,13,11,.9),rgba(16,13,11,0));color:var(--washi)}
.logo-sub{font-family:var(--mincho);font-size:34px;letter-spacing:.4em}
.logo-main{font-family:var(--mincho);font-size:140px;letter-spacing:.06em;-webkit-text-stroke:8px var(--sumi);paint-order:stroke;text-shadow:0 8px 0 var(--shu)}
.menu-col{position:absolute;left:0;right:0;bottom:56px;display:flex}
.menu-col .btn{flex:1;width:auto;min-width:0;height:120px;font-size:34px}
.credit{position:absolute;left:0;right:0;bottom:0;height:56px;line-height:56px;text-align:center;background:var(--sumi);color:var(--washi2);font-size:20px;border-top:3px solid var(--shu)}
.topbar{height:var(--hud);flex:0 0 var(--hud);display:flex;align-items:stretch;background:var(--sumi);border-bottom:4px solid var(--shu)}
.topbar .btn,.topbar .spacer{width:240px;min-width:0;height:auto;font-size:28px}
.topttl{flex:1;display:flex;align-items:center;justify-content:center;color:var(--washi);font-family:var(--mincho);font-size:40px;letter-spacing:.15em}
.epgrid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:0}
.eptile{border:0;background:linear-gradient(var(--washi),var(--washi2));box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.eptile:hover{filter:brightness(1.06)}
.eptile.locked{background:var(--sumi2);color:#8a7a66;box-shadow:inset 0 0 0 2px #3a322c}
.eptile.notready:not(.locked){background:#cdbf9f}
.epno{font-family:var(--mincho);font-size:22px;color:var(--shu)}
.eptile.locked .epno{color:#8a7a66}
.eptt{height:60px;display:flex;align-items:center;text-align:center;font-family:var(--mincho);font-size:24px;line-height:1.25}
.epst{height:30px;font-size:22px;color:var(--shu);letter-spacing:-1px}
.zbody{flex:1;display:flex;align-items:center;justify-content:center;background:rgba(16,13,11,.55)}
.zk-icon{font-size:120px}.zk-name{font-family:var(--mincho);font-size:44px}.zk-desc{font-size:30px;margin:12px 0}
.result{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:120px;background:linear-gradient(var(--washi),var(--washi2))}
.result .btnrow{position:absolute;left:0;right:0;bottom:0}
.result .btnrow .btn{flex:1;width:auto;height:120px}
.res-title{font-family:var(--mincho);font-size:72px;letter-spacing:.1em}
.res-star{font-size:110px;color:var(--shu);line-height:1.2}.res-star .off{color:#cdbf9f}
.res-note{font-size:26px;color:var(--ink2)}
.res-pass{margin-top:20px;font-size:26px}.res-pass b,.pw{font-family:var(--mincho);font-size:46px;letter-spacing:.1em;color:var(--shu)}
.cl-title{font-family:var(--mincho);font-size:40px}
table.cl{margin:16px auto;border-collapse:collapse;font-size:28px}
table.cl td{padding:6px 18px;border-bottom:2px solid var(--washi2);text-align:left}
table.cl td.st{color:var(--shu)}
.cl-total{font-family:var(--mincho);font-size:40px;color:var(--shu)}
.settings{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:0}
.settings .btn{width:auto;height:auto;min-width:0;font-size:34px}
/* 調整 */
.btn:disabled{opacity:1;filter:grayscale(1) brightness(.55)}
#layer.battle .guide{right:520px;clip-path:none}
.res-pass{text-align:center}
.zbody{background:linear-gradient(var(--sumi2),var(--sumi3))}
.zdetail{flex:0 0 150px;background:linear-gradient(var(--washi),var(--washi2));border-top:6px solid var(--shu);padding:20px 48px;font-size:30px;line-height:1.5;text-align:left}
.paper{top:var(--hud);padding-top:160px}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="layer"></div>
  <div class="port" id="portL" hidden></div>
  <div class="port" id="portR" hidden></div>
  <div id="hud" hidden>
    <div id="hearts"></div>
    <div id="eptitle"></div>
    <button class="hudbtn" id="cardBtn" hidden>カード</button>
    <button class="hudbtn" id="hintBtn" hidden>ヒント</button>
    <button class="hudbtn" id="menuBtn">ちゅうだん</button>
  </div>
  <div id="catch" hidden></div>
  <div id="talk" hidden>
    <div class="tname"></div>
    <div class="ttext"></div>
    <button class="speak" title="読み上げ">🔊</button>
    <div class="next">▼</div>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="fx"></div>

const split = s => s.split(/\s*[|｜]\s*/);
function parseDialog(l) {
  if (/^[＊*]/.test(l)) return { who: "", expr: "", text: l.replace(/^[＊*]\s*/, "") };
  const m = l.match(/^([^「（(]+?)\s*(?:[（(](.+?)[）)])?「([\s\S]*)」$/);
  if (m) return { who: m[1].trim(), expr: (m[2] || "ふつう").trim(), text: m[3] };
  return null;
}
function parseScript(no, src) {
  const ep = { no, title: "", nodes: [], cards: [], chars: {} };
  let block = null;
  for (const raw of src.split(/\r?\n/)) {
    const l = raw.trim();
    if (!l || l.startsWith("//")) continue;
    if (l[0] === "#") { ep.title = l.slice(1).trim(); continue; }
    if (l[0] === "@") {
      const [cmd, ...rest] = l.slice(1).trim().split(/\s+/); const arg = rest.join(" ");
      block = null;
      const add = b => { ep.nodes.push(b); block = b; };
      switch (cmd) {
        case "背景": ep.nodes.push({ t: "bg", bg: arg }); break;
        case "人物": { const [n, ic, side] = rest; ep.chars[n] = { icon: ic || "🙂", side: side || "R", col: "#6c8ead" }; break; }
        case "カード": block = { t: "cards" }; break;
        case "調査": add({ t: "inv", items: [], hint: "" }); break;
        case "まちがい探し": add({ t: "spot", items: [], hint: "" }); break;
        case "論破バトル": add({ t: "battle", rounds: [[]], hint: "" }); break;
        case "まとめ": add({ t: "sum", lines: [], hint: "" }); break;
        case "記憶のかけら": add({ t: "frag", title: arg, lines: [] }); break;
        case "クリア": ep.nodes.push({ t: "clear" }); break;
        case "ゆがみ": ep.nodes.push({ t: "warp", text: arg || "歴史が ゆがんだ！" }); break;
        case "ゆがめる": ep.nodes.push({ t: "warp", text: "歴史が ゆがんだ！", who: arg }); break;
        case "もどす": ep.nodes.push({ t: "restore", who: arg }); break;
        case "議論": add({ t: "testi", who: arg, rounds: [{ title: "", lines: [] }], hint: "" }); break;
        default: console.warn("不明な命令", cmd);
      }
      continue;
    }
    if (block) {
      if (block.t === "frag") { block.lines.push(parseDialog(l) || { who: "", expr: "", text: l.replace(/^-\s*/, "") }); continue; }
      if (/^ヒント[：:]/.test(l)) { block.hint = l.replace(/^ヒント[：:]\s*/, ""); continue; }
      if (block.t === "battle" && /^-{3,}$/.test(l)) { block.rounds.push([]); continue; }
      if (block.t === "testi" && /^-{3,}$/.test(l)) { block.rounds.push({ title: "", lines: [] }); continue; }
      if (block.t === "testi" && /^証言[：:]/.test(l)) { block.rounds[block.rounds.length - 1].title = l.replace(/^証言[：:]\s*/, ""); continue; }
      if (block.t === "sum" && /^文[：:]/.test(l)) { block.lines.push(l.replace(/^文[：:]\s*/, "")); continue; }
      if (/^[-・]\s/.test(l)) {
        const p = split(l.replace(/^[-・]\s*/, ""));
        if (block.t === "cards") { const [name, icon, desc, kw] = p; CARDS[name] = { name, icon, desc, kw: kw || name, ep: no }; ep.cards.push(name); }
        else if (block.t === "inv") { const [icon, name, pos, line, card] = p; block.items.push({ icon, name, pos: pos.split(",").map(Number), line, card }); }
        else if (block.t === "spot") { const [kind, icon, name, pos, item, quote, card, fixItem, explain] = p; block.items.push({ bad: /[✕×xX]/.test(kind), icon, name, pos: pos.split(",").map(Number), item, quote, card, fixItem, explain }); }
        else if (block.t === "testi") { const [kind, text, card, retort, reaction] = p; block.rounds[block.rounds.length - 1].lines.push({ lie: /矛盾|ウソ/.test(kind), text, card, retort, reaction }); }
        else if (block.t === "battle") { const [kind, text, card, reply] = p; block.rounds[block.rounds.length - 1].push({ lie: /ウソ/.test(kind), text, card, reply }); }
        continue;
      }
    }
    const d = parseDialog(l);
    if (d) { block = null; ep.nodes.push({ t: "say", ...d }); continue; }
    console.warn("読めない行", l);
  }
  return ep;
}

function pager(names, opts) {
  const per = opts.perPage || 8, cols = opts.cols || 8;
  const wrap = h("div", "pager");
  const prev = h("button", "pg-arrow", "◀"), next = h("button", "pg-arrow", "▶");
  const grid = h("div", "pg-grid"); grid.style.gridTemplateColumns = `repeat(${cols}, var(--card-w))`;
  const dots = h("div", "pg-dots");
  const pages = Math.max(1, Math.ceil(names.length / per));
  let page = 0, selName = null;
  const draw = () => {
    grid.innerHTML = "";
    names.slice(page * per, page * per + per).forEach(n => {
      const e = cardEl(n, { unknown: opts.unknown && opts.unknown(n) });
      if (n === selName) e.classList.add("sel");
      e.onclick = () => { selName = n; grid.querySelectorAll(".card").forEach(c => c.classList.remove("sel")); e.classList.add("sel"); opts.onTap && opts.onTap(n); };
      grid.appendChild(e);
    });
    for (let k = grid.children.length; k < per; k++) grid.appendChild(h("div", "card blank"));   // 空きわくで大きさを固定
    prev.disabled = page === 0; next.disabled = page >= pages - 1;
    dots.innerHTML = pages > 1 ? Array.from({ length: pages }, (_, k) => `<span class="dot${k === page ? " on" : ""}"></span>`).join("") : "";
  };
  prev.onclick = () => { if (page > 0) { page--; draw(); } };
  next.onclick = () => { if (page < pages - 1) { page++; draw(); } };
  const row = h("div", "pg-row"); row.append(prev, grid, next);
  wrap.append(row, dots);
  draw();
  return wrap;
}

/* ---------- プレイ中の状態 ---------- */
let S = null;   // { no, ep, idx, hearts, hand, hint2, failed, narrow, hintLv, node }
const MAX_HEARTS = 5, RETRY_HEARTS = 3;
function renderHud() {
  hud.hidden = !S;
  if (!S) return;
  const hv = on => `<svg class="heart" viewBox="0 0 24 22"><path d="M12 21C-6 9 4-4 12 4C20-4 30 9 12 21Z" fill="${on ? "#d8392f" : "#3a322c"}" stroke="${on ? "#f4ead2" : "#6b5a45"}" stroke-width="1.6"/></svg>`;
  $("#hearts").innerHTML = Array.from({ length: MAX_HEARTS }, (_, i) => hv(i < S.hearts)).join("");
  $("#eptitle").textContent = S.no === 0 ? S.ep.title : `第${S.no}話　${S.ep.title.replace(/^第\d+話\s*/, "")}`;
  const hb = $("#hintBtn"), n = S.node;
  const interactive = n && ["inv", "spot", "testi", "battle", "sum"].includes(n.t);
  hb.hidden = !interactive;
  const canJump = !!(S.hintCtx && S.hintCtx.jump);
  let label = "ヒント", dis = false;
  if (n && n.t !== "inv") {
    if (S.hintLv === 1) label = "しぼる ♡−1";
    else if (S.hintLv === 2 && canJump) label = "さらにしぼる ♡−1";
    else if (S.hintLv >= 2) { label = "しぼりこみ中"; dis = true; }
  }
  hb.textContent = label; hb.disabled = dis;
  $("#cardBtn").hidden = !S.hand.length;
}
/* 証言のまとまり（ラウンド）が変わるたびに、しぼりこみをリセット */
function newRound(ctx) {
  S.hintCtx = ctx || null; S.narrow = false; S.narrowSet = null; S.narrowCache = {};
  if (S.hintLv > 1) S.hintLv = 1;
  renderHud();
}
async function loseHeart(who, expr, msg) {
  S.hearts = Math.max(0, S.hearts - 1); shake(); renderHud();
  await say(who, expr, msg, S.ep);
  if (S.hearts <= 0) throw FAIL;
}
async function onHint() {
  if (!S || !S.node || S.busy) return;
  const n = S.node, ctx = S.hintCtx || {};
  S.busy = true;
  let fail = false;
  try {
    if (S.hintLv === 0 || n.t === "inv") {
      await say("本じい", "ふつう", n.hint || "教科書で キーワードを 調べてみるのじゃ", S.ep);
      S.hintLv = Math.max(S.hintLv, 1);
    } else if (S.hintLv === 1) {
      if (await confirmBox("♡を 1つ 使って、つきつける カードを<br><b>3まいに しぼりますか？</b>", "しぼる")) {
        S.hearts--; shake(); S.narrow = true; S.hintLv = 2;
        if (ctx.correct) S.narrowSet = pick3(ctx.correct);
        renderHud();
        await say("本じい", "ふつう", "よし、つきつける カードを 3まいに しぼってやろう", S.ep);
        if (S.hearts <= 0) fail = true;
      }
    } else if (S.hintLv === 2 && ctx.jump) {
      if (await confirmBox("♡を もう 1つ 使って、<br><b>あやしい ところを 教えて もらいますか？</b>", "教えてもらう")) {
        S.hearts--; shake(); S.hintLv = 3; renderHud();
        await say("本じい", "ふつう", "しかたないのう。あやしい ところに しるしを つけてやろう", S.ep);
        ctx.jump();
        if (S.hearts <= 0) fail = true;
      }
    }
  } finally { S.busy = false; hideTalk(); hidePortraits(); renderHud(); }
  if (fail && S.rej) S.rej(FAIL);
}

/* ---------- 場面：調査 ---------- */
function placeAt(e, pos) { e.style.left = pos[0] + "%"; e.style.top = pos[1] + "%"; }
function runInv(n) {
  return new Promise((res, rej) => {
    S.rej = rej;
    clearLayer(); hideTalk(); hidePortraits();
    const got = new Set(n.items.filter(it => S.hand.includes(it.card)).map(it => it.name));
    const info = h("div", "guide"); layer.appendChild(info);
    const upd = () => { info.innerHTML = `むらを 調べよう（のこり ${n.items.length - got.size}）`; };
    upd();
    n.items.forEach(it => {
      const e = h("button", "prop", `${iconHTML(it.icon)}<div class="plabel">${esc(it.name)}</div>`);
      placeAt(e, it.pos); if (got.has(it.name)) e.classList.add("done");
      e.onclick = async () => {
        if (S.busy) return; S.busy = true;
        try {
          let who = it.name, text = it.line;
          const m = text.match(/^(.+?)[：:](.*)$/);
          if (/^[＊*]/.test(text)) { who = ""; text = text.replace(/^[＊*]\s*/, ""); }
          else if (m && (CHARS[m[1]] || S.ep.chars[m[1]])) { who = m[1]; text = m[2]; }
          else if (!S.ep.chars[who] && !CHARS[who]) who = "";
          await say(who, "ふつう", text, S.ep); hideTalk(); hidePortraits();
          if (it.card && !S.hand.includes(it.card)) { S.hand.push(it.card); renderHud(); await showCardGet(it.card); }
          got.add(it.name); e.classList.add("done"); upd();
        } catch (er) { S.busy = false; return rej(er); }
        S.busy = false;
        if (got.size >= n.items.length) { await sleep(300); res(); }
      };
      layer.appendChild(e);
    });
    if (got.size >= n.items.length) res();
  });
}

      const e = h("button", "prop warped", `${iconHTML(it.icon)}${it.item ? `<div class="pitem">${it.item}</div>` : ""}<div class="plabel">${esc(it.name)}</div>`);
      placeAt(e, it.pos);

function runBattle(n) {
  return new Promise((res, rej) => {
    S.rej = rej;
    let r = 0;
    const total = n.rounds.length;
    const draw = () => {
      clearLayer(); hideTalk(); hidePortraits();
      layer.className = "battle";
      const foe = h("div", "foe", `<div class="foe-face">${charOf("ユガミ").icon}</div><div class="foe-name">ユガミ</div>`);
      const gauge = h("div", "gauge", Array.from({ length: total }, (_, i) => `<span class="seg${i < total - r ? "" : " off"}"></span>`).join(""));
      foe.prepend(gauge); layer.appendChild(foe);
      layer.appendChild(h("div", "guide", `ユガミの ウソを 見やぶれ（${r + 1} / ${total}）`));
      const list = h("div", "claims");
      const claimEls = [];
      const lie = n.rounds[r].find(x => x.lie);
      newRound({ correct: lie && lie.card, jump: () => { const k = n.rounds[r].findIndex(x => x.lie); if (claimEls[k]) claimEls[k].classList.add("suspect"); } });
      n.rounds[r].forEach((c, i) => {
        const e = h("button", "claim", `<span class="q">「</span>${fmt(c.text)}<span class="q">」</span>`);
        e.onclick = async () => {
          if (S.busy) return; S.busy = true;
          try {
            const pick = await chooseCard("ウソだと 思ったら、矛盾する カードを つきつけろ！", c.lie ? c.card : null, { who: "ユガミ", text: c.text });
            if (pick && !c.lie) {
              await loseHeart("ユガミ", "笑顔", "フフ……それは ほんとうの ことだ。");
            } else if (pick) {
              if (pick === c.card) {
                bigText("論破！", "ronpa"); shake(); await sleep(900);
                if (c.reply) await say("ユウキ", "怒り", c.reply, S.ep);
                r++;
                if (r >= total) { S.busy = false; hideTalk(); return res(); }
                await say("ユガミ", "怒り", "くっ……まだだ！", S.ep);
                S.busy = false; return draw();
              } else {
                await loseHeart("ユガミ", "笑顔", "ハハハ！ そんな カードで オレの 歴史は くずせないぞ！");
              }
            }

          } catch (er) { S.busy = false; return rej(er); }

    };

}

/* ---------- 場面：議論（証言に矛盾をつきつける） ---------- */
function runTesti(n) {
  return new Promise((res, rej) => {
    S.rej = rej;
    const who = n.who, c = charOf(who, S.ep);
    let r = 0, i = 0;
    const draw = (first) => {
      clearLayer(); hideTalk(); hidePortraits();
      layer.className = "testi";
      const aura = S.aura.includes(who);
      layer.appendChild(h("div", "witness" + (aura ? " aura" : ""), `<div class="w-face" style="--c:${c.col}">${c.icon}</div><div class="w-name">${esc(who)}</div>`));
      const round = n.rounds[r];
      layer.appendChild(h("div", "guide", `証言「${esc(round.title || "")}」（${r + 1} / ${n.rounds.length}）`));
      const box = h("div", "tbox");
      box.innerHTML = `<div class="tname">${esc(who)}</div><div class="ttext"></div><div class="tcount"></div>`;
      const sp = h("button", "speak", "🔊"); box.appendChild(sp);
      layer.appendChild(box);
      const nav = h("div", "tnav");
      const prev = btn("◀ 前へ", "sub", () => go(-1));
      const pres = btn("つきつける！", "red", present);
      const next = btn("次へ ▶", "sub", () => go(1));
      box.onclick = e => { if (!e.target.closest(".speak")) go(1); };
      nav.append(prev, pres, next); layer.appendChild(nav);
      const show = () => {
        const line = round.lines[i];
        box.querySelector(".ttext").innerHTML = fmt(line.text);
        box.querySelector(".tcount").textContent = `${i + 1} / ${round.lines.length}`;
        box.classList.toggle("suspect", suspect && i === lieIdx);
        prev.disabled = i === 0;
        sp.onclick = () => speak(line.text);
        if (SAVE.opt.autoRead) speak(line.text);
        box.classList.remove("flip"); void box.offsetWidth; box.classList.add("flip");
      };
      const go = async d => {
        if (S.busy) return;
        if (d > 0 && i === round.lines.length - 1) {   // さいごの証言のあと：本じいが話して最初にもどる
          S.busy = true;
          try { await say("本じい", "ふつう", "証言は ここまでじゃ。矛盾は 見つかったかのう？ もう一度、最初から 聞いてみるのじゃ", S.ep); }
          finally { hideTalk(); hidePortraits(); S.busy = false; }
          i = 0; show(); return;
        }
        if (d < 0 && i === 0) return;
        i += d; show();
      };
      const lieIdx = round.lines.findIndex(x => x.lie);
      let suspect = false;
      newRound({ correct: round.lines[lieIdx] && round.lines[lieIdx].card, jump: () => { suspect = true; i = lieIdx; show(); } });
      async function present() {
        if (S.busy) return; S.busy = true;
        const line = round.lines[i];
        try {
          const pick = await chooseCard("この 証言と 矛盾する カードを つきつけろ！", line.lie ? line.card : null, { who, text: line.text });
          if (pick && line.lie && pick === line.card) {
            stopSpeak(); bigText("矛盾 はっけん！", "ronpa"); shake(); await sleep(1000);
            if (line.retort) await say("ユウキ", "怒り", line.retort, S.ep);
            if (line.reaction) await say(who, "おどろき", line.reaction, S.ep, { noPort: true });
            r++; i = 0;
            S.busy = false;
            if (r >= n.rounds.length) { hideTalk(); return res(); }
            return draw();
          } else if (pick) {
            await loseHeart("本じい", "おどろき", line.lie ? "むむ……その カードでは、矛盾を 説明 できんようじゃ" : "むむ……その 証言には、おかしな ところは ないようじゃ");
            hideTalk(); hidePortraits();
          }
        } catch (er) { S.busy = false; return rej(er); }
        S.busy = false;
      }
      show();
      if (first) banner("", `〜 証言 〜<br>${esc(round.title || "")}`);
    };
    draw(true);
  });
}

/* ---------- 話の進行 ---------- */
function checkpoint() {
  SAVE.resume = { no: S.no, idx: S.idx, hearts: S.hearts, hand: S.hand.slice(), aura: S.aura.slice(), hint2: S.hint2, failed: S.failed };
  persist();
}
async function playEpisode(no, resume) {
  const ep = EPS[no];
  S = { no, ep, idx: 0, hearts: MAX_HEARTS, hand: [], aura: [], hint2: false, failed: false, narrow: false, narrowSet: null, narrowCache: {}, hintCtx: null, hintLv: 0, node: null, busy: false };
  if (resume && SAVE.resume && SAVE.resume.no === no) Object.assign(S, SAVE.resume, { no, ep });
  // 再開時は直前の背景を復元
  let bg = EP_META[no][1];
  for (let i = 0; i < S.idx; i++) if (ep.nodes[i].t === "bg") bg = ep.nodes[i].bg;
  setBg(bg); if (S.aura.length) bgEl.classList.add("warped"); clearLayer(); renderHud();
  while (S.idx < ep.nodes.length) {
    const n = ep.nodes[S.idx];
    S.node = n; S.hintLv = 0; S.rej = null; newRound(null);
    const interactive = ["inv", "spot", "testi", "battle", "sum", "frag"].includes(n.t);
    if (interactive) checkpoint();
    const snap = { hand: S.hand.slice() };
    try {
      switch (n.t) {
        case "bg": setBg(n.bg); break;
        case "say": await say(n.who, n.expr, n.text, ep); break;
        case "inv": await runInv(n); break;
        case "spot": await runSpot(n); break;
        case "battle": await runBattle(n); break;
        case "sum": await runSum(n); break;
        case "frag": await runFrag(n); break;
        case "warp": await runWarp(n); break;
        case "restore": await runRestore(n); break;
        case "testi": await runTesti(n); break;
        case "clear": return finishEpisode();
      }
    } catch (e) {
      if (e === FAIL) {
        closeModal(); hideTalk(); S.busy = false;
        bigText("ゲームオーバー", "bad"); await sleep(1500);
        await say("本じい", "おどろき", "しっかりするのじゃ！ ♡3つで、この場面の 最初から やりなおすぞ", ep);
        S.hearts = RETRY_HEARTS; S.failed = true; S.hand = snap.hand; renderHud();
        continue;
      }
      throw e;
    }
    if (n.t !== "say" && n.t !== "bg") { hideTalk(); clearLayer(); }
    S.idx++;
  }
  return finishEpisode();
}
function finishEpisode() {
  bgEl.classList.remove("warped");
  hideTalk(); hidePortraits(); clearLayer();
  const no = S.no;
  // ★＝クリア時の♡の数。1度でもゲームオーバーになったら★1
  let star = S.failed ? 1 : Math.max(1, Math.min(MAX_HEARTS, S.hearts));
  if (no === 0) star = MAX_HEARTS;
  SAVE.stars[no] = Math.max(SAVE.stars[no] || 0, star);
  S.ep.cards.forEach(c => SAVE.cards[c] = 1);
  S.hand.forEach(c => SAVE.cards[c] = 1);
  SAVE.resume = null; persist();
  const ep = S.ep; S = null; renderHud();
  showResult(no, ep, star);
}

      if (!ready) return alertBox("この おはなしは じゅんび中です。");
      if (no > 0 && !SAVE.stars[no - 1] && EPS[no - 1]) {
        await alertBox("前の おはなしから 遊ぶのが おすすめだよ。");
      }
      if (SAVE.resume && SAVE.resume.no === no) {
        const box = h("div", "inbox"); box.appendChild(h("div", "in-msg", "とちゅうから つづけますか？"));
        const row = h("div", "btnrow");
        row.appendChild(btn("つづきから", "", () => { closeModal(); playEpisode(no, true); }));
        row.appendChild(btn("はじめから", "sub", () => { closeModal(); playEpisode(no, false); }));
        box.appendChild(row); openModal(box);
      } else playEpisode(no, false);
    };
    grid.appendChild(t);
  });
  for (let k = EP_META.length; k % 6; k++) grid.appendChild(h("div", "eptile locked"));   // 最後の段の空きをうめる
  layer.appendChild(grid);
}

/* ---------- 画面：クリア一覧（先生に見せる） ---------- */
function showClearList() {
  const total = Object.values(SAVE.stars).reduce((a, b) => a + b, 0);
  const rows = EP_META.map(([t], no) => SAVE.stars[no] ? `<tr><td>${no === 0 ? "プロローグ" : "第" + no + "話"}</td><td>${esc(t)}</td><td class="st">${"★".repeat(SAVE.stars[no])}</td></tr>` : "").join("");
  alertBox(`<div class="cl-title">クリア一覧</div><table class="cl">${rows || "<tr><td>まだ クリアした おはなしは ありません</td></tr>"}</table><div class="cl-total">★の 合計　${total}</div>`);
}

/* ---------- 画面：けっか ---------- */
function showResult(no, ep, star) {
  setBg("夜"); clearLayer(); layer.className = "menu";
  const box = h("div", "result");

  box.appendChild(h("div", "res-note", star === MAX_HEARTS ? "パーフェクト！" : "クリアした ときの ♡の 数が ★に なるよ（ゲームオーバーに なると ★1）"));
  box.appendChild(h("div", "res-pass", `ふっかつの じゅもん<br><b>${makePassword()}</b>`));

/* ---------- 画面：ずかん ---------- */
function showZukan() {
  S = null; renderHud(); setBg("夜"); clearLayer(); layer.className = "menu";
  const names = Object.keys(CARDS);
  const have = names.filter(n => SAVE.cards[n]).length;

    if (!SAVE.cards[n]) { zd.innerHTML = "まだ 手に入れて いない カードだよ"; return; }
    const c = CARDS[n];
    zd.innerHTML = `<b>${esc(c.name)}</b>　${fmt(c.desc)}<div class="cg-kw">調べる キーワード：<b>${esc(c.kw)}</b></div>`;

/* ---------- 画面：せってい ---------- */
function showSettings() {
  S = null; renderHud(); setBg("夜"); clearLayer(); layer.className = "menu";
  const top = h("div", "topbar");
  top.appendChild(btn("もどる", "sub", showTitle));
  top.appendChild(h("div", "topttl", "せってい"));
  top.appendChild(h("div", "spacer"));
  layer.appendChild(top);
  const col = h("div", "settings");
  const tog = (label, key) => btn(`${label}：${SAVE.opt[key] ? "ON" : "OFF"}`, "", () => { SAVE.opt[key] = !SAVE.opt[key]; persist(); showSettings(); });
  col.appendChild(tog("ふりがな", "ruby"));
  col.appendChild(tog("自動で 読み上げ", "autoRead"));
  col.appendChild(btn("ふっかつの じゅもんを 見る", "", () => alertBox(`いまの ふっかつの じゅもん<br><b class="pw">${makePassword()}</b><br><small>セーブが 消えたときに 使うよ。メモしておこう！</small>`)));
  col.appendChild(btn("ふっかつの じゅもんを 入れる", "", restoreFromPassword));
  layer.appendChild(col);

/* ---------- かいほうの じゅもん ---------- */
const normKana = s => (s || "").trim().replace(/\s+/g, "").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function fnv(s) { let x = 2166136261; for (const ch of "mh:" + s) { x ^= ch.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; } return x.toString(36); }
async function enterSpell() {
  const v = await inputBox("かいほうの じゅもんを 入れてね", "ひらがなで 入力");
  if (v == null) return;
  const hs = fnv(normKana(v));
  const no = (window.UNLOCK_HASHES || []).indexOf(hs);
  if (no > 0) {
    SAVE.unlocked = Math.max(SAVE.unlocked, no); persist();
    await alertBox(`じゅもんが ひかった！<br><b>第${no}話</b>まで ひらいたよ！`);
  } else await alertBox("じゅもんが ちがうようだ……");
}

/* ---------- ふっかつの じゅもん（開放＋★） ---------- */
const PW_MASK = [19, 7, 28, 3, 22, 11, 30, 14, 5, 25, 9, 17, 2, 27, 12];
const PW_LEN = 15;
const PW_CH = "あいうえおかきくけこさしすせそたちつてとなにのはひふへほまみむも"; // 32文字（見まちがえやすい字はのぞく）
function makePassword() {
  let v = BigInt(Math.min(SAVE.unlocked, 31));
  for (let i = 0; i < EP_COUNT; i++) v |= BigInt(Math.min(SAVE.stars[i] || 0, 7)) << BigInt(5 + i * 3);
  const digits = [];
  for (let i = 0; i < PW_LEN; i++) { digits.push(Number(v & 31n)); v >>= 5n; }
  const sum = digits.reduce((a, d, i) => (a + d * (i + 3)) % 32, 7);
  const s = [...digits.map((d, i) => d ^ PW_MASK[i]), sum].map(d => PW_CH[d]).join("");
  return s.slice(0, 4) + "・" + s.slice(4, 8) + "・" + s.slice(8, 12) + "・" + s.slice(12);
}
function readPassword(str) {
  const s = normKana(str).replace(/[・･\-ー]/g, "");
  if (s.length !== PW_LEN + 1) return null;
  const d = [...s].map(c => PW_CH.indexOf(c));
  if (d.some(x => x < 0)) return null;
  for (let i = 0; i < PW_LEN; i++) d[i] ^= PW_MASK[i];
  const sum = d.slice(0, PW_LEN).reduce((a, x, i) => (a + x * (i + 3)) % 32, 7);
  if (sum !== d[PW_LEN]) return null;
  let v = 0n; for (let i = PW_LEN - 1; i >= 0; i--) v = (v << 5n) | BigInt(d[i]);
  const unlocked = Number(v & 31n), stars = {};
  for (let i = 0; i < EP_COUNT; i++) { const s2 = Number((v >> BigInt(5 + i * 3)) & 7n); if (s2 > MAX_HEARTS) return null; if (s2) stars[i] = s2; }
  if (unlocked >= EP_COUNT) return null;
  return { unlocked, stars };
}
async function restoreFromPassword() {
  const v = await inputBox("ふっかつの じゅもんを 入れてね", "例：あいうえ・かきくけ・こさしす・せそた");
  if (v == null) return;
  const r = readPassword(v);
  if (!r) return alertBox("じゅもんが ちがうようだ……<br>もう一度 たしかめてね。");
  SAVE.unlocked = Math.max(SAVE.unlocked, r.unlocked);
  for (const k in r.stars) {
    SAVE.stars[k] = Math.max(SAVE.stars[k] || 0, r.stars[k]);
    if (EPS[k]) EPS[k].cards.forEach(c => SAVE.cards[c] = 1);
  }
  persist();
  await alertBox("ふっかつ した！");
  showSettings();
}

/* ---------- 起動 ---------- */
function boot() {
  stage = $("#stage"); layer = $("#layer"); bgEl = $("#bg"); talk = $("#talk"); catcher = $("#catch"); modal = $("#modal"); fx = $("#fx"); hud = $("#hud");
  for (const k in (window.SCENARIO_SRC || {})) EPS[k] = parseScript(Number(k), window.SCENARIO_SRC[k]);
  $("#hintBtn").onclick = onHint;
  $("#cardBtn").onclick = showHandViewer;
  $("#menuBtn").onclick = async () => {
    if (!S || S.busy) return;
    const box = h("div", "inbox"); box.appendChild(h("div", "in-msg", "おはなしを ちゅうだんしますか？<br><small>場面の はじめから 再開できます</small>"));
    const row = h("div", "btnrow");
    row.appendChild(btn("ちゅうだんする", "", () => { closeModal(); location.reload(); }));
    row.appendChild(btn("つづける", "sub", closeModal));
    box.appendChild(row); openModal(box);
  };
  addEventListener("resize", fit); fit();
  showTitle();
}
addEventListener("DOMContentLoaded", boot);
