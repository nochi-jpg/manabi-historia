<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まなびヒストリア</title>
<style>:root{
  --ink:#2a2420; --paper:#fffaf0; --accent:#e76f51; --gold:#f4c95d; --ui:#2b2340;
  --btn-h:76px; --btn-w:440px; --card-w:150px; --card-h:196px; --hud:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:"BIZ UDPGothic","BIZ UDゴシック","Hiragino Maru Gothic ProN","Meiryo",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:#111}
#bg,#bg svg{position:absolute;inset:0;width:100%;height:100%}
#layer{position:absolute;inset:0}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ボタン：大きさをそろえる */
.btn{white-space:nowrap;height:var(--btn-h);min-width:220px;padding:0 32px;border-radius:18px;border:4px solid var(--ink);background:var(--gold);color:var(--ink);font-size:30px;font-weight:bold;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.sub{background:#fff}
.btnrow{display:flex;gap:24px;justify-content:center;margin-top:24px}
.btnrow .btn{width:340px;white-space:nowrap}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:16px;padding:16px 24px;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
#hearts{display:flex;gap:6px;height:var(--hud);align-items:center;background:rgba(255,255,255,.85);border:4px solid var(--ink);border-radius:16px;padding:0 14px}
.heart{font-size:36px;line-height:1;width:44px;text-align:center}
#eptitle{flex:1;height:var(--hud);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:#fff;text-shadow:0 2px 6px #000}
.hudbtn{height:var(--hud);min-width:160px;border-radius:16px;border:4px solid var(--ink);background:#fff;font-size:24px;font-weight:bold}
.hudbtn:disabled{opacity:.6}

/* 立ち絵（仮） */
.port{position:absolute;bottom:250px;width:240px;height:300px;z-index:8;transition:opacity .2s,transform .2s}
#portL{left:60px} #portR{right:60px}
.port.dim{opacity:.45;transform:scale(.94)}
.pface{width:240px;height:240px;border-radius:40px;background:var(--c);border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:150px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.pname{display:none;margin-top:8px;text-align:center;color:#fff;font-size:24px;font-weight:bold;text-shadow:0 2px 4px #000}
.pexpr{position:absolute;top:-18px;right:-14px;font-size:60px}

/* セリフ枠 */
#catch{position:absolute;inset:0;z-index:30}
#talk{position:absolute;left:40px;right:40px;bottom:30px;height:200px;z-index:31;background:rgba(255,250,240,.96);border:6px solid var(--ink);border-radius:24px;padding:34px 120px 20px 44px;cursor:pointer}
#talk.dark{background:rgba(20,16,30,.92);border-color:#b9a7e6;color:#eee}
.tname{position:absolute;top:-28px;left:36px;height:52px;line-height:44px;padding:0 24px;background:var(--ink);color:#fff;border-radius:14px;font-size:26px;font-weight:bold;border:4px solid #fff}
.ttext{font-size:36px;line-height:1.7}
.ttext.narr{color:#5a4a3a;font-style:normal}
#talk.dark .ttext.narr{color:#d8cfee}
.speak{position:absolute;right:24px;top:24px;width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);background:#fff;font-size:34px}
.next{position:absolute;right:44px;bottom:16px;font-size:28px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(6px)}}
ruby rt{font-size:.45em}
.kw{color:#c2410c;font-weight:bold}
#talk.dark .kw{color:#ffb38a}

/* 案内 */
.guide{position:absolute;left:50%;top:104px;transform:translateX(-50%);height:60px;line-height:52px;padding:0 28px;background:rgba(43,35,64,.9);color:#fff;border:4px solid #fff;border-radius:16px;font-size:26px;font-weight:bold;z-index:5;white-space:nowrap}

/* 場面の小物 */
.prop{position:absolute;width:150px;height:150px;transform:translate(-50%,-50%);border:none;background:rgba(255,255,255,.22);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s;outline:4px solid rgba(255,255,255,.7)}
.prop:hover{transform:translate(-50%,-50%) scale(1.06)}
.picon{font-size:76px;line-height:1}
.plabel{height:34px;line-height:34px;padding:0 10px;background:rgba(0,0,0,.65);color:#fff;font-size:20px;font-weight:bold;border-radius:10px;white-space:nowrap}
.prop.done{opacity:.55;outline-color:#6ee7b7}
.prop.done::after,.prop.checked::after{content:"✔";position:absolute;top:-10px;right:-10px;width:44px;height:44px;border-radius:50%;background:#10b981;color:#fff;font-size:28px;line-height:44px}
.prop.warp .picon{animation:warp 2.4s infinite}
@keyframes warp{0%,100%{filter:none}50%{filter:hue-rotate(90deg) saturate(1.6)}}
.prop.fixed{outline-color:var(--gold);background:rgba(255,230,150,.45)}

/* カード：大きさをそろえる */
.card{width:var(--card-w);height:var(--card-h);flex:0 0 auto;border-radius:16px;border:4px solid var(--ink);background:linear-gradient(#fff,#fdf1d6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 var(--ink);padding:8px}
.card:hover{transform:translateY(-6px)}
.cicon{font-size:72px;line-height:1;height:84px;display:flex;align-items:center}
.cname{height:56px;display:flex;align-items:center;text-align:center;font-size:20px;font-weight:bold;line-height:1.3}
.card.large{--card-w:220px;--card-h:288px}.card.large .cicon{font-size:110px;height:120px}.card.large .cname{font-size:28px}
.card.unknown{background:#ccc;color:#666}

/* モーダル */
.modal{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.modal.bottom{align-items:flex-end}
.inbox,.cardget{min-width:760px;max-width:1200px;max-height:820px;overflow:auto;background:var(--paper);border:6px solid var(--ink);border-radius:28px;padding:40px 48px;text-align:center;font-size:30px;line-height:1.6}
.in-title,.cg-title{font-size:34px;font-weight:bold;margin-bottom:20px}
.inbox input{width:100%;height:84px;font-size:40px;text-align:center;border:4px solid var(--ink);border-radius:16px;font-family:inherit}
.cardget .card{margin:0 auto 20px}
.cg-desc{font-size:28px;margin-bottom:12px}
.cg-kw{font-size:24px;color:#555;margin-bottom:8px}
.hand{width:100%;background:rgba(43,35,64,.96);border-top:6px solid var(--gold);padding:24px 32px 28px;text-align:center}
.hand-title{color:#fff;font-size:30px;font-weight:bold;margin-bottom:18px}
.hand-row{display:flex;gap:16px;justify-content:flex-start;flex-wrap:wrap;margin:0 auto 18px;width:1500px}
.hand .btn{height:64px;font-size:26px}

/* 論破バトル */
.foe{position:absolute;right:80px;top:170px;width:360px;text-align:center}
.foe-face{width:300px;height:300px;margin:0 auto;border-radius:50%;background:radial-gradient(#7b5ea7,#2a1a44);border:6px solid #d8c8ff;display:flex;align-items:center;justify-content:center;font-size:170px;box-shadow:0 0 60px #9b6fd1}
.foe-name{color:#fff;font-size:32px;font-weight:bold;margin-top:10px;text-shadow:0 2px 6px #000}
.gauge{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.seg{width:90px;height:28px;border-radius:8px;background:#e11d48;border:4px solid #fff}
.seg.off{background:#444}
.claims{position:absolute;left:80px;top:190px;width:1000px;display:flex;flex-direction:column;gap:28px}
.claim{min-height:140px;text-align:left;padding:20px 32px;font-size:34px;line-height:1.6;border-radius:24px;border:5px solid #2a1a44;background:#f5efff;box-shadow:0 8px 0 #2a1a44}
.claim:hover{background:#fff}
.claim.checked{opacity:.5}
.claim .q{color:#7b5ea7;font-weight:bold}

/* まとめ */
.paper{position:absolute;left:50%;top:200px;transform:translateX(-50%);width:1300px;background:var(--paper);border:6px solid var(--ink);border-radius:28px;padding:40px 56px;font-size:38px;line-height:2.4}
.paper p{margin:0}
.slot{min-width:260px;height:76px;padding:0 20px;margin:0 6px;border-radius:14px;border:4px dashed var(--accent);background:#fff3ea;font-size:34px;font-weight:bold;vertical-align:middle}
.slot.ok{border-style:solid;border-color:#10b981;background:#d1fae5}

/* 記憶のかけら */
#layer.frag{background:#000}
.frag-head{position:absolute;top:120px;width:100%;text-align:center;color:#d8cfee;font-size:44px;letter-spacing:.2em;animation:fade 1.2s}
.frag-pic{position:absolute;left:50%;top:220px;transform:translateX(-50%);width:640px;height:360px;border:4px solid #b9a7e6;border-radius:18px;background:#16121f;color:#d8cfee;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:100px;animation:fade 1.2s}
.frag-cap{font-size:26px;margin-top:12px}
@keyframes fade{from{opacity:0}}

/* 効果 */
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.big{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:100px;font-weight:900;white-space:nowrap;-webkit-text-stroke:8px var(--ink);paint-order:stroke;animation:pop 1.4s forwards}
.big.good{color:var(--gold)}
.big.ronpa{color:#ff4d6d;font-size:180px}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{opacity:0}}
.banner{position:absolute;left:0;right:0;top:40%;height:140px;line-height:140px;text-align:center;background:rgba(0,0,0,.75);color:#fff;font-size:60px;font-weight:bold;animation:pop2 1.8s forwards}
@keyframes pop2{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
#stage.shake{animation:shk .35s}
@keyframes shk{20%{margin-left:-14px}40%{margin-left:14px}60%{margin-left:-8px}80%{margin-left:8px}}

/* メニュー画面 */
#layer.menu{display:flex;flex-direction:column;align-items:center}
.logo{margin-top:110px;text-align:center;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.6)}
.logo-sub{font-size:34px;letter-spacing:.2em}
.logo-main{font-size:120px;font-weight:900;-webkit-text-stroke:6px #2b2340;paint-order:stroke}
.menu-col{display:flex;flex-direction:column;gap:22px;margin-top:40px}
.menu-col .btn{width:var(--btn-w)}
.credit{position:absolute;bottom:20px;color:#fff;font-size:20px;text-shadow:0 2px 4px #000}
.topbar{width:100%;height:120px;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.topbar .btn,.topbar .spacer{width:220px}
.topttl{color:#fff;font-size:44px;font-weight:bold;text-shadow:0 2px 6px #000}
.epgrid{display:grid;grid-template-columns:repeat(6,230px);gap:18px;margin-top:4px}
.eptile{height:170px;border-radius:18px;border:4px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;box-shadow:0 6px 0 var(--ink)}
.eptile.locked{background:#5b5670;color:#ddd}
.eptile.notready:not(.locked){background:#d9d4c7}
.epno{font-size:20px;font-weight:bold;color:#a0522d}
.eptile.locked .epno{color:#ddd}
.eptt{height:64px;display:flex;align-items:center;text-align:center;font-size:22px;font-weight:bold;line-height:1.3}
.epst{height:34px;font-size:28px;color:#e0a100}
.zgrid{display:grid;grid-template-columns:repeat(8,var(--card-w));gap:20px;margin-top:10px;max-height:740px;overflow:auto;padding:10px}
.zk-icon{font-size:120px}.zk-name{font-size:40px;font-weight:bold}.zk-desc{font-size:30px;margin:12px 0}
.result{margin-top:120px;background:var(--paper);border:6px solid var(--ink);border-radius:28px;padding:40px 80px;text-align:center}
.res-title{font-size:56px;font-weight:900}
.res-star{font-size:110px;color:#e0a100;line-height:1.2}.res-star .off{color:#ccc}
.res-note{font-size:26px;color:#555}
.res-pass{margin-top:20px;font-size:26px}.res-pass b,.pw{font-size:44px;letter-spacing:.1em;color:#2b2340}
.cl-title{font-size:40px;font-weight:bold}
table.cl{margin:16px auto;border-collapse:collapse;font-size:28px}
table.cl td{padding:6px 18px;border-bottom:2px solid #ddd;text-align:left}
table.cl td.st{color:#e0a100}
.cl-total{font-size:40px;font-weight:bold;color:#c2410c}

/* 影絵の村人 */
.sil{width:96px;height:112px;color:#2a1610;fill:currentColor}
.sil .eyes{fill:#ffe9b0;opacity:0}
.prop.warped{background:rgba(120,60,200,.28);outline-color:#c79bff;animation:wobble 2.6s ease-in-out infinite}
.prop.warped .sil{filter:drop-shadow(0 0 10px #b26bff) drop-shadow(0 0 4px #e0c2ff)}
.prop.warped .sil .eyes{opacity:1;fill:#f0d0ff}
@keyframes wobble{0%,100%{transform:translate(-50%,-50%) rotate(0)}50%{transform:translate(-50%,-50%) rotate(-2deg)}}
.pitem{position:absolute;top:-14px;right:-18px;width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid var(--ink);font-size:38px;line-height:56px;text-align:center}
.prop.fixed .pitem{border-color:#10b981}
#bg.warped svg{filter:hue-rotate(230deg) saturate(1.3) brightness(.8)}
.warpfx{position:absolute;inset:0;background:radial-gradient(circle,rgba(200,140,255,.0) 0,rgba(140,60,220,.75) 70%);animation:warpin 2.2s forwards}
@keyframes warpin{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.hand-quote{display:inline-block;max-width:1300px;margin-bottom:14px;padding:12px 28px;background:#fff;border:4px solid #c79bff;border-radius:16px;font-size:30px;line-height:1.5;color:var(--ink)}
.hand-quote b{color:#7b5ea7;margin-right:8px}
.inbox.wide{width:1400px;max-width:1400px}
.hv-detail{min-height:120px;font-size:28px;text-align:left;background:#fff;border:3px solid #ddd;border-radius:14px;padding:16px 24px;margin:8px 0 16px}
.card.sel{outline:6px solid var(--accent)}

/* 紫のオーラ（ゆがめられたキーマン） */
.port.aura .pface,.witness.aura .w-face{box-shadow:0 0 0 6px #c79bff,0 0 40px 14px #9b4dff;filter:saturate(.7) brightness(.85) hue-rotate(-20deg);animation:auraw 2.4s ease-in-out infinite}
@keyframes auraw{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-2deg) translateY(-6px)}}
/* 議論パート */
.witness{position:absolute;right:120px;top:170px;width:360px;text-align:center}
.w-face{width:320px;height:320px;margin:0 auto;border-radius:48px;background:var(--c);border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:200px}
.w-name{margin-top:12px;color:#fff;font-size:32px;font-weight:bold;text-shadow:0 2px 6px #000}
.tbox{position:absolute;left:40px;right:40px;bottom:30px;height:200px;background:rgba(255,250,240,.97);border:6px solid #7b5ea7;border-radius:24px;padding:34px 120px 20px 44px;z-index:6}
.tbox .tname{background:#7b5ea7}
.tbox .tcount{position:absolute;right:44px;bottom:16px;font-size:24px;font-weight:bold;color:#7b5ea7}
.tbox.flip .ttext{animation:fade .35s}
.tnav{position:absolute;right:40px;bottom:256px;display:flex;gap:16px;z-index:6}
.tnav .btn{width:240px;height:76px}
.btn.red{background:#ff4d6d;color:#fff}

.hand{padding-top:18px}
.hand-detail{width:1500px;margin:0 auto;min-height:96px;text-align:left;background:#fffaf0;border:4px solid var(--gold);border-radius:16px;padding:14px 24px;font-size:28px;line-height:1.5;color:var(--ink)}
.hand .btnrow{margin-top:16px}
.hand .btnrow .btn{width:300px;height:72px}
.btn:disabled{opacity:.45;cursor:default}
.banner.tall{height:auto;line-height:1.4;padding:24px 0}
.zgrid{justify-content:start}

/* しぼる：あやしい ところの しるし */
.tbox.suspect,.claim.suspect{border-color:#f59e0b;box-shadow:0 0 0 6px #fcd34d,0 8px 0 #2a1a44}
.tbox.suspect::before,.claim.suspect::before{content:"🔎 あやしい！";position:absolute;top:-30px;right:140px;height:52px;line-height:44px;padding:0 18px;background:#f59e0b;color:#fff;border:4px solid #fff;border-radius:14px;font-size:24px;font-weight:bold}
.claim{position:relative}
.claim.suspect::before{top:-24px;right:24px}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="layer"></div>
  <div class="port" id="portL" hidden></div>
  <div class="port" id="portR" hidden></div>
  <div id="hud" hidden>
    <div id="hearts"></div>
    <div id="eptitle"></div>
    <button class="hudbtn" id="cardBtn" hidden>カード</button>
    <button class="hudbtn" id="hintBtn" hidden>ヒント</button>
    <button class="hudbtn" id="menuBtn">ちゅうだん</button>
  </div>
  <div id="catch" hidden></div>
  <div id="talk" hidden>
    <div class="tname"></div>
    <div class="ttext"></div>
    <button class="speak" title="読み上げ">🔊</button>
    <div class="next">▼</div>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="fx"></div>
</div>

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

}

const CARDS = {};     // 名前 → カード

const split = s => s.split(/\s*[|｜]\s*/);
function parseDialog(l) {
  if (/^[＊*]/.test(l)) return { who: "", expr: "", text: l.replace(/^[＊*]\s*/, "") };
  const m = l.match(/^([^「（(]+?)\s*(?:[（(](.+?)[）)])?「([\s\S]*)」$/);
  if (m) return { who: m[1].trim(), expr: (m[2] || "ふつう").trim(), text: m[3] };
  return null;
}
function parseScript(no, src) {
  const ep = { no, title: "", nodes: [], cards: [], chars: {} };
  let block = null;
  for (const raw of src.split(/\r?\n/)) {
    const l = raw.trim();
    if (!l || l.startsWith("//")) continue;
    if (l[0] === "#") { ep.title = l.slice(1).trim(); continue; }
    if (l[0] === "@") {
      const [cmd, ...rest] = l.slice(1).trim().split(/\s+/); const arg = rest.join(" ");
      block = null;
      const add = b => { ep.nodes.push(b); block = b; };
      switch (cmd) {
        case "背景": ep.nodes.push({ t: "bg", bg: arg }); break;
        case "人物": { const [n, ic, side] = rest; ep.chars[n] = { icon: ic || "🙂", side: side || "R", col: "#6c8ead" }; break; }
        case "カード": block = { t: "cards" }; break;
        case "調査": add({ t: "inv", items: [], hint: "" }); break;
        case "まちがい探し": add({ t: "spot", items: [], hint: "" }); break;
        case "論破バトル": add({ t: "battle", rounds: [[]], hint: "" }); break;
        case "まとめ": add({ t: "sum", lines: [], hint: "" }); break;
        case "記憶のかけら": add({ t: "frag", title: arg, lines: [] }); break;
        case "クリア": ep.nodes.push({ t: "clear" }); break;
        case "ゆがみ": ep.nodes.push({ t: "warp", text: arg || "歴史が ゆがんだ！" }); break;
        case "ゆがめる": ep.nodes.push({ t: "warp", text: "歴史が ゆがんだ！", who: arg }); break;
        case "もどす": ep.nodes.push({ t: "restore", who: arg }); break;
        case "議論": add({ t: "testi", who: arg, rounds: [{ title: "", lines: [] }], hint: "" }); break;
        default: console.warn("不明な命令", cmd);
      }
      continue;
    }
    if (block) {
      if (block.t === "frag") { block.lines.push(parseDialog(l) || { who: "", expr: "", text: l.replace(/^-\s*/, "") }); continue; }
      if (/^ヒント[：:]/.test(l)) { block.hint = l.replace(/^ヒント[：:]\s*/, ""); continue; }
      if (block.t === "battle" && /^-{3,}$/.test(l)) { block.rounds.push([]); continue; }
      if (block.t === "testi" && /^-{3,}$/.test(l)) { block.rounds.push({ title: "", lines: [] }); continue; }
      if (block.t === "testi" && /^証言[：:]/.test(l)) { block.rounds[block.rounds.length - 1].title = l.replace(/^証言[：:]\s*/, ""); continue; }
      if (block.t === "sum" && /^文[：:]/.test(l)) { block.lines.push(l.replace(/^文[：:]\s*/, "")); continue; }
      if (/^[-・]\s/.test(l)) {
        const p = split(l.replace(/^[-・]\s*/, ""));
        if (block.t === "cards") { const [name, icon, desc, kw] = p; CARDS[name] = { name, icon, desc, kw: kw || name, ep: no }; ep.cards.push(name); }
        else if (block.t === "inv") { const [icon, name, pos, line, card] = p; block.items.push({ icon, name, pos: pos.split(",").map(Number), line, card }); }
        else if (block.t === "spot") { const [kind, icon, name, pos, item, quote, card, fixItem, explain] = p; block.items.push({ bad: /[✕×xX]/.test(kind), icon, name, pos: pos.split(",").map(Number), item, quote, card, fixItem, explain }); }
        else if (block.t === "testi") { const [kind, text, card, retort, reaction] = p; block.rounds[block.rounds.length - 1].lines.push({ lie: /矛盾|ウソ/.test(kind), text, card, retort, reaction }); }
        else if (block.t === "battle") { const [kind, text, card, reply] = p; block.rounds[block.rounds.length - 1].push({ lie: /ウソ/.test(kind), text, card, reply }); }
        continue;
      }
    }
    const d = parseDialog(l);
    if (d) { block = null; ep.nodes.push({ t: "say", ...d }); continue; }
    console.warn("読めない行", l);
  }
  return ep;
}

    if (S.hintLv === 0 || n.t === "inv") {
      await say("本じい", "ふつう", n.hint || "教科書で キーワードを 調べてみるのじゃ", S.ep);
      S.hintLv = 1;
    } else {
      S.narrow = true; S.hint2 = true;
      if (S.onHint2) {   // 議論・論破：あやしい ところを 教えてから しぼる
        await say("本じい", "ふつう", "しかたないのう。あやしい ところに しるしを つけて、カードも 3まいに しぼってやろう。（★が 1つ へるぞ）", S.ep);
        S.onHint2();
      } else await say("本じい", "ふつう", "よし、次に カードを えらぶとき、3まいに しぼってやろう。（★が 1つ へるぞ）", S.ep);
    }
  } finally { S.busy = false; hideTalk(); hidePortraits(); renderHud(); }
}

/* ---------- 場面：調査 ---------- */
function placeAt(e, pos) { e.style.left = pos[0] + "%"; e.style.top = pos[1] + "%"; }
function runInv(n) {
  return new Promise((res, rej) => {
    clearLayer(); hideTalk(); hidePortraits();
    const got = new Set(n.items.filter(it => S.hand.includes(it.card)).map(it => it.name));
    const info = h("div", "guide"); layer.appendChild(info);
    const upd = () => { info.innerHTML = `🔍 むらを 調べよう（のこり ${n.items.length - got.size}）`; };
    upd();
    n.items.forEach(it => {
      const e = h("button", "prop", `${iconHTML(it.icon)}<div class="plabel">${esc(it.name)}</div>`);
      placeAt(e, it.pos); if (got.has(it.name)) e.classList.add("done");
      e.onclick = async () => {
        if (S.busy) return; S.busy = true;
        try {
          let who = it.name, text = it.line;
          const m = text.match(/^(.+?)[：:](.*)$/);
          if (/^[＊*]/.test(text)) { who = ""; text = text.replace(/^[＊*]\s*/, ""); }
          else if (m && (CHARS[m[1]] || S.ep.chars[m[1]])) { who = m[1]; text = m[2]; }
          else if (!S.ep.chars[who] && !CHARS[who]) who = "";
          await say(who, "ふつう", text, S.ep); hideTalk(); hidePortraits();
          if (it.card && !S.hand.includes(it.card)) { S.hand.push(it.card); renderHud(); await showCardGet(it.card); }
          got.add(it.name); e.classList.add("done"); upd();
        } catch (er) { S.busy = false; return rej(er); }
        S.busy = false;
        if (got.size >= n.items.length) { await sleep(300); res(); }
      };
      layer.appendChild(e);
    });
    if (got.size >= n.items.length) res();
  });
}

/* ---------- 場面：まちがい探し（証言につきつける） ---------- */
function runSpot(n) {
  return new Promise((res, rej) => {
    clearLayer(); hideTalk(); hidePortraits();
    bgEl.classList.add("warped");
    const fixed = new Set();
    const bads = n.items.filter(i => i.bad).length;
    const info = h("div", "guide"); layer.appendChild(info);
    const upd = () => { info.innerHTML = `⚠️ ゆがんだ 証言を 見やぶれ！（のこり ${bads - fixed.size}）`; };
    upd();
    n.items.forEach((it, i) => {
      const e = h("button", "prop warped", `${iconHTML(it.icon)}${it.item ? `<div class="pitem">${it.item}</div>` : ""}<div class="plabel">${esc(it.name)}</div>`);
      placeAt(e, it.pos);
      e.onclick = async () => {
        if (S.busy || fixed.has(i)) return; S.busy = true;
        try {
          const pick = await chooseCard("この 証言と 矛盾する カードを つきつけろ！", it.bad ? it.card : null, { who: it.name, text: it.quote });
          if (pick && it.bad && pick === it.card) {
            fixed.add(i); bigText("矛盾 はっけん！", "ronpa"); shake(); await sleep(900);
            e.classList.remove("warped"); e.classList.add("fixed");
            const pi = e.querySelector(".pitem"); if (pi && it.fixItem) pi.textContent = it.fixItem;
            if (it.explain) await say("本じい", "笑顔", it.explain, S.ep);
            upd();
          } else if (pick && it.bad) {
            await loseHeart("ユガミ", "笑顔", "ハハハ、そのカードでは 矛盾して いないぞ！");
          } else if (pick) {
            await loseHeart("本じい", "おどろき", "むむ……その 証言は、この時代と 矛盾して いないようじゃ");
          }
          hideTalk(); hidePortraits();
        } catch (er) { S.busy = false; return rej(er); }
        S.busy = false;
        if (fixed.size >= bads) {
          await sleep(300);
          layer.querySelectorAll(".prop.warped").forEach(p => p.classList.remove("warped"));
          bgEl.classList.remove("warped"); bigText("ただしい 歴史に もどった！", "good"); await sleep(1300);
          res();
        }
      };
      layer.appendChild(e);
    });
  });
}

/* ---------- 場面：論破バトル ---------- */
function runBattle(n) {
  return new Promise((res, rej) => {
    let r = 0;
    const total = n.rounds.length;
    const draw = () => {
      clearLayer(); hideTalk(); hidePortraits();
      layer.className = "battle";
      const foe = h("div", "foe", `<div class="foe-face">${charOf("ユガミ").icon}</div><div class="foe-name">ユガミ</div>`);
      const gauge = h("div", "gauge", Array.from({ length: total }, (_, i) => `<span class="seg${i < total - r ? "" : " off"}"></span>`).join(""));
      foe.prepend(gauge); layer.appendChild(foe);
      layer.appendChild(h("div", "guide", `⚔️ ユガミの ウソを 見やぶれ！（${r + 1} / ${total}）`));
      const list = h("div", "claims");
      const claimEls = [];
      S.onHint2 = () => { const k = n.rounds[r].findIndex(x => x.lie); if (claimEls[k]) claimEls[k].classList.add("suspect"); };
      n.rounds[r].forEach((c, i) => {
        const e = h("button", "claim", `<span class="q">「</span>${fmt(c.text)}<span class="q">」</span>`);
        e.onclick = async () => {
          if (S.busy) return; S.busy = true;
          try {
            const pick = await chooseCard("ウソだと 思ったら、矛盾する カードを つきつけろ！", c.lie ? c.card : null, { who: "ユガミ", text: c.text });
            if (pick && !c.lie) {
              await loseHeart("ユガミ", "笑顔", "フフ……それは ほんとうの ことだ。");
            } else if (pick) {
              if (pick === c.card) {
                bigText("論破！", "ronpa"); shake(); await sleep(900);
                if (c.reply) await say("ユウキ", "怒り", c.reply, S.ep);
                r++;
                if (r >= total) { S.busy = false; hideTalk(); return res(); }
                await say("ユガミ", "怒り", "くっ……まだだ！", S.ep);
                S.busy = false; return draw();
              } else {
                await loseHeart("ユガミ", "笑顔", "ハハハ！ そんな カードで オレの 歴史は くずせないぞ！");
              }
            }
            hideTalk(); hidePortraits();
          } catch (er) { S.busy = false; return rej(er); }
          S.busy = false;
        };
        claimEls.push(e); list.appendChild(e);
      });
      layer.appendChild(list);
    };
    draw();
  });
}

/* ---------- 場面：議論（証言に矛盾をつきつける） ---------- */
function runTesti(n) {
  return new Promise((res, rej) => {
    const who = n.who, c = charOf(who, S.ep);
    let r = 0, i = 0;
    const draw = (first) => {
      clearLayer(); hideTalk(); hidePortraits();
      layer.className = "testi";
      const aura = S.aura.includes(who);
      layer.appendChild(h("div", "witness" + (aura ? " aura" : ""), `<div class="w-face" style="--c:${c.col}">${c.icon}</div><div class="w-name">${esc(who)}</div>`));
      const round = n.rounds[r];
      layer.appendChild(h("div", "guide", `🗣️ 証言「${esc(round.title || "")}」（${r + 1} / ${n.rounds.length}）`));
      const box = h("div", "tbox");
      box.innerHTML = `<div class="tname">${esc(who)}</div><div class="ttext"></div><div class="tcount"></div>`;
      const sp = h("button", "speak", "🔊"); box.appendChild(sp);
      layer.appendChild(box);
      const nav = h("div", "tnav");
      const prev = btn("◀ まえ", "sub", () => go(-1));
      const pres = btn("つきつける！", "red", present);
      const next = btn("つぎ ▶", "sub", () => go(1));
      nav.append(prev, pres, next); layer.appendChild(nav);
      const show = () => {
        const line = round.lines[i];
        box.querySelector(".ttext").innerHTML = fmt(line.text);
        box.querySelector(".tcount").textContent = `${i + 1} / ${round.lines.length}`;
        box.classList.toggle("suspect", suspect && i === lieIdx);
        sp.onclick = () => speak(line.text);
        if (SAVE.opt.autoRead) speak(line.text);
        box.classList.remove("flip"); void box.offsetWidth; box.classList.add("flip");
      };
      const go = d => {
        if (S.busy) return;
        i = (i + d + round.lines.length) % round.lines.length; show();
      };
      const lieIdx = round.lines.findIndex(x => x.lie);
      let suspect = false;
      S.onHint2 = () => { suspect = true; i = lieIdx; show(); };
      async function present() {
        if (S.busy) return; S.busy = true;
        const line = round.lines[i];
        try {
          const pick = await chooseCard("この 証言と 矛盾する カードを つきつけろ！", line.lie ? line.card : null, { who, text: line.text });
          if (pick && line.lie && pick === line.card) {
            stopSpeak(); bigText("矛盾 はっけん！", "ronpa"); shake(); await sleep(1000);
            if (line.retort) await say("ユウキ", "怒り", line.retort, S.ep);
            if (line.reaction) await say(who, "おどろき", line.reaction, S.ep, { noPort: true });
            r++; i = 0;
            S.busy = false;
            if (r >= n.rounds.length) { hideTalk(); return res(); }
            return draw();
          } else if (pick) {
            await loseHeart("本じい", "おどろき", line.lie ? "むむ……その カードでは、矛盾を 説明 できんようじゃ" : "むむ……その 証言には、おかしな ところは ないようじゃ");
            hideTalk(); hidePortraits();
          }
        } catch (er) { S.busy = false; return rej(er); }
        S.busy = false;
      }
      show();
      if (first) banner("", `〜 証言 〜<br>${esc(round.title || "")}`);
    };
    draw(true);
  });
}

/* ---------- 話の進行 ---------- */
function checkpoint() {
  SAVE.resume = { no: S.no, idx: S.idx, hearts: S.hearts, hand: S.hand.slice(), aura: S.aura.slice(), hint2: S.hint2, failed: S.failed };
  persist();
}
async function playEpisode(no, resume) {
  const ep = EPS[no];
  S = { no, ep, idx: 0, hearts: 3, hand: [], aura: [], hint2: false, failed: false, narrow: false, hintLv: 0, node: null, busy: false };
  if (resume && SAVE.resume && SAVE.resume.no === no) Object.assign(S, SAVE.resume, { no, ep });
  // 再開時は直前の背景を復元
  let bg = EP_META[no][1];
  for (let i = 0; i < S.idx; i++) if (ep.nodes[i].t === "bg") bg = ep.nodes[i].bg;
  setBg(bg); if (S.aura.length) bgEl.classList.add("warped"); clearLayer(); renderHud();
  while (S.idx < ep.nodes.length) {
    const n = ep.nodes[S.idx];
    S.node = n; S.hintLv = 0; S.narrow = false; S.onHint2 = null; renderHud();
    const interactive = ["inv", "spot", "testi", "battle", "sum", "frag"].includes(n.t);
    if (interactive) checkpoint();
    const snap = { hand: S.hand.slice() };
    try {
      switch (n.t) {
        case "bg": setBg(n.bg); break;
        case "say": await say(n.who, n.expr, n.text, ep); break;
        case "inv": await runInv(n); break;
        case "spot": await runSpot(n); break;
        case "battle": await runBattle(n); break;
        case "sum": await runSum(n); break;
        case "frag": await runFrag(n); break;
        case "warp": await runWarp(n); break;
        case "restore": await runRestore(n); break;
        case "testi": await runTesti(n); break;
        case "clear": return finishEpisode();
      }
    } catch (e) {
      if (e === FAIL) {
        closeModal();
        await say("本じい", "おどろき", "しっかりするのじゃ！ この場面を もう一度 やりなおすぞ", ep);
        S.hearts = 3; S.failed = true; S.hand = snap.hand; renderHud();
        continue;
      }
      throw e;
    }
    if (n.t !== "say" && n.t !== "bg") { hideTalk(); clearLayer(); }
    S.idx++;
  }
  return finishEpisode();
}
function finishEpisode() {
  bgEl.classList.remove("warped");
  hideTalk(); hidePortraits(); clearLayer();
  const no = S.no;
  let star = 1;
  if (!S.failed && S.hearts >= 2) star = 2;
  if (star === 2 && !S.hint2) star = 3;
  if (no === 0) star = 3;
  SAVE.stars[no] = Math.max(SAVE.stars[no] || 0, star);
  S.ep.cards.forEach(c => SAVE.cards[c] = 1);
  S.hand.forEach(c => SAVE.cards[c] = 1);
  SAVE.resume = null; persist();
  const ep = S.ep; S = null; renderHud();
  showResult(no, ep, star);
}

/* ---------- かいほうの じゅもん ---------- */
const normKana = s => (s || "").trim().replace(/\s+/g, "").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function fnv(s) { let x = 2166136261; for (const ch of "mh:" + s) { x ^= ch.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; } return x.toString(36); }
async function enterSpell() {
  const v = await inputBox("かいほうの じゅもんを 入れてね", "ひらがなで 入力");
  if (v == null) return;
  const hs = fnv(normKana(v));
  const no = (window.UNLOCK_HASHES || []).indexOf(hs);
  if (no > 0) {
    SAVE.unlocked = Math.max(SAVE.unlocked, no); persist();
    await alertBox(`じゅもんが ひかった！<br><b>第${no}話</b>まで ひらいたよ！`);
  } else await alertBox("じゅもんが ちがうようだ……");
}

/* ---------- ふっかつの じゅもん（開放＋★） ---------- */
const PW_MASK = [19, 7, 28, 3, 22, 11, 30, 14, 5, 25];
const PW_CH = "あいうえおかきくけこさしすせそたちつてとなにのはひふへほまみむも"; // 32文字（見まちがえやすい字はのぞく）
function makePassword() {
  let v = BigInt(Math.min(SAVE.unlocked, 31));
  for (let i = 0; i < EP_COUNT; i++) v |= BigInt(Math.min(SAVE.stars[i] || 0, 3)) << BigInt(5 + i * 2);
  const digits = [];
  for (let i = 0; i < 10; i++) { digits.push(Number(v & 31n)); v >>= 5n; }
  const sum = digits.reduce((a, d, i) => (a + d * (i + 3)) % 32, 7);
  const s = [...digits.map((d, i) => d ^ PW_MASK[i]), sum].map(d => PW_CH[d]).join("");
  return s.slice(0, 4) + "・" + s.slice(4, 8) + "・" + s.slice(8);
}
function readPassword(str) {
  const s = normKana(str).replace(/[・･\-ー]/g, "");
  if (s.length !== 11) return null;
  const d = [...s].map(c => PW_CH.indexOf(c));
  if (d.some(x => x < 0)) return null;
  for (let i = 0; i < 10; i++) d[i] ^= PW_MASK[i];
  const sum = d.slice(0, 10).reduce((a, x, i) => (a + x * (i + 3)) % 32, 7);
  if (sum !== d[10]) return null;
  let v = 0n; for (let i = 9; i >= 0; i--) v = (v << 5n) | BigInt(d[i]);
  const unlocked = Number(v & 31n), stars = {};
  for (let i = 0; i < EP_COUNT; i++) { const s2 = Number((v >> BigInt(5 + i * 2)) & 3n); if (s2) stars[i] = s2; }
  if (unlocked >= EP_COUNT) return null;
  return { unlocked, stars };
}
async function restoreFromPassword() {
  const v = await inputBox("ふっかつの じゅもんを 入れてね", "例：あいうえ・かきくけ・こさし");
  if (v == null) return;
  const r = readPassword(v);
  if (!r) return alertBox("じゅもんが ちがうようだ……<br>もう一度 たしかめてね。");
  SAVE.unlocked = Math.max(SAVE.unlocked, r.unlocked);
  for (const k in r.stars) {
    SAVE.stars[k] = Math.max(SAVE.stars[k] || 0, r.stars[k]);
    if (EPS[k]) EPS[k].cards.forEach(c => SAVE.cards[c] = 1);
  }
  persist();
  await alertBox("ふっかつ した！");
  showSettings();
}

/* ---------- 起動 ---------- */
function boot() {
  stage = $("#stage"); layer = $("#layer"); bgEl = $("#bg"); talk = $("#talk"); catcher = $("#catch"); modal = $("#modal"); fx = $("#fx"); hud = $("#hud");
  for (const k in (window.SCENARIO_SRC || {})) EPS[k] = parseScript(Number(k), window.SCENARIO_SRC[k]);
  $("#hintBtn").onclick = onHint;
  $("#cardBtn").onclick = showHandViewer;
  $("#menuBtn").onclick = async () => {
    if (!S || S.busy) return;
    const box = h("div", "inbox"); box.appendChild(h("div", "in-msg", "おはなしを ちゅうだんしますか？<br><small>場面の はじめから 再開できます</small>"));
    const row = h("div", "btnrow");
    row.appendChild(btn("ちゅうだんする", "", () => { closeModal(); location.reload(); }));
    row.appendChild(btn("つづける", "sub", closeModal));
    box.appendChild(row); openModal(box);
  };
  addEventListener("resize", fit); fit();
  showTitle();
}
addEventListener("DOMContentLoaded", boot);
