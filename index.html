/* ===== まなびヒストリア UI：半透明の黒ウィンドウ =====
   背景を見せたまま、半透明の黒と細い白線だけで組む。部品は画面のふちから40px内側にそろえる。
   フォント：Zen角ゴシック New（Medium 500 / Bold 700 / Black 900・OFL） */
:root{
  --win:rgba(8,10,16,.74); --win2:rgba(8,10,16,.55); --line:rgba(255,255,255,.55); --line2:rgba(255,255,255,.22);
  --red:#ff4d5e; --gold:#ffd166; --m:40px;
  --btn-h:64px; --card-w:150px; --card-h:170px; --box:210px;
  --font:"Gothic","Zen Kaku Gothic New","BIZ UDPGothic","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:var(--font);font-weight:500;color:#fff;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:#0b0d12}
#bg,#bg svg{position:absolute;inset:0;width:100%;height:100%}
#layer{position:absolute;inset:0}
button{font-family:inherit;cursor:pointer;color:#fff}
[hidden]{display:none!important}

/* ---------- ボタン（すべて同じ形） ---------- */
.btn{height:var(--btn-h);min-width:200px;padding:0 28px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  background:var(--win);border:2px solid var(--line);border-radius:6px;font-size:28px;font-weight:700;letter-spacing:.04em;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:rgba(40,44,60,.85);border-color:#fff}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.red{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red),0 0 16px rgba(255,77,94,.35)}
.btn:disabled{opacity:.35;cursor:default}
.btnrow{display:flex;gap:20px;justify-content:center}
.btnrow .btn{width:300px}

/* ---------- 左上：ハート／右上：タグとボタン ---------- */
#hud{position:absolute;inset:0;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
#hearts{position:absolute;left:var(--m);top:34px;display:flex;gap:10px}
.heart{width:34px;height:30px;display:block}
#tags{position:absolute;right:0;top:28px;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.tag{height:60px;display:flex;align-items:center;padding:0 40px 0 48px;background:var(--win);border:2px solid var(--line);border-right:0;font-size:30px;font-weight:700;
  clip-path:polygon(24px 0,100% 0,100% 100%,24px 100%,0 50%)}
.tag.sub{height:52px;font-size:26px}
.tag:empty{display:none}
#hudbtns{position:absolute;right:280px;top:28px;display:flex;gap:12px}
.hudbtn{width:160px;height:60px;background:var(--win);border:2px solid var(--line);border-radius:6px;font-size:24px;font-weight:700}
.hudbtn:hover:not(:disabled){background:rgba(40,44,60,.85);border-color:#fff}
.hudbtn:disabled{opacity:.4;cursor:default}

/* ---------- 左上：案内のリボン ---------- */
.guide{position:absolute;left:0;top:110px;height:56px;display:flex;align-items:center;padding:0 52px 0 var(--m);background:var(--win);border:2px solid var(--line);border-left:0;
  font-size:26px;font-weight:700;white-space:nowrap;z-index:5;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%)}
.guide b{color:var(--red);margin-right:14px}

/* ---------- 顔グラ（正方形・細いわく） ---------- */
.port{position:absolute;bottom:calc(var(--box) + 110px);width:300px;height:300px;z-index:8;transition:opacity .2s}
#portL{left:var(--m)} #portR{right:var(--m)}
.port.dim{opacity:.45}
.pface{width:300px;height:300px;background:var(--win2);border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:190px}
.pname{display:none}
.pexpr{position:absolute;top:10px;right:14px;font-size:56px}

/* ---------- セリフのウィンドウ ---------- */
#catch{position:absolute;inset:0;z-index:30}
#talk,.tbox{position:absolute;left:var(--m);right:var(--m);bottom:36px;height:var(--box);z-index:31;cursor:pointer;padding:40px 120px 0 56px;
  background:var(--win);border:2px solid var(--line);border-radius:6px;font-size:36px;line-height:1.7;letter-spacing:.03em}
.tbox{z-index:6}
#talk.dark{background:rgba(14,10,24,.88);border-color:rgba(200,180,255,.6)}
.tname{position:absolute;left:-2px;top:-56px;height:52px;display:flex;align-items:center;padding:0 44px 0 28px;background:var(--win);border:2px solid var(--line);border-bottom:0;border-radius:6px 0 0 0;
  font-size:28px;font-weight:700;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 100%,0 100%)}
.tname:empty{display:none}
.ttext.narr{color:#d9dbe6}
.speak{position:absolute;right:26px;top:24px;width:60px;height:60px;border-radius:50%;border:2px solid var(--line);background:rgba(255,255,255,.06);font-size:26px}
.next{position:absolute;right:30px;bottom:18px;font-size:22px;opacity:.8;animation:bob 1s infinite}
#talk.typing .next{visibility:hidden}
@keyframes bob{50%{transform:translateY(5px)}}
.tcount{position:absolute;right:30px;bottom:18px;font-size:22px;opacity:.8}
ruby rt{font-size:.45em;font-weight:500}
.kw{color:var(--gold);font-weight:700}
.tw-h{visibility:hidden}

/* ---------- 調べる場面 ---------- */
.prop{position:absolute;width:150px;height:150px;transform:translate(-50%,-50%);background:var(--win);border:2px solid var(--line);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .12s,border-color .12s}
.prop:hover{transform:translate(-50%,-50%) scale(1.05);border-color:#fff}
.picon{font-size:76px;line-height:1}
.plabel{font-size:20px;font-weight:700;white-space:nowrap}
.prop.done{opacity:.5}
.prop.done::after,.prop.checked::after{content:"✓";position:absolute;top:-12px;right:-12px;width:40px;height:40px;border-radius:50%;background:#fff;color:#0b0d12;font-size:24px;line-height:40px;font-weight:900}
.sil{width:90px;height:105px;color:#fff;fill:currentColor}
.sil .eyes{opacity:0}

/* ---------- カード ---------- */
.card{width:var(--card-w);height:var(--card-h);flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;
  background:rgba(255,255,255,.05);border:2px solid var(--line2);border-radius:6px;transition:border-color .1s,background .1s}
.card:hover{border-color:var(--line)}
.cicon{font-size:64px;line-height:1;height:72px;display:flex;align-items:center}
.cname{height:52px;display:flex;align-items:center;text-align:center;font-size:20px;font-weight:700;line-height:1.25}
.card.large{--card-w:220px;--card-h:260px}.card.large .cicon{font-size:100px;height:110px}.card.large .cname{font-size:26px}
.card.unknown{color:rgba(255,255,255,.35)}
.card.sel{border-color:#fff;background:rgba(255,255,255,.15);box-shadow:0 0 0 2px #fff}
.card.blank{border-style:dashed;background:none;border-color:rgba(255,255,255,.1);cursor:default}

/* ---------- ページ送り ---------- */
.pager{display:flex;flex-direction:column;align-items:center;gap:12px}
.pg-row{display:flex;align-items:center;gap:20px}
.pg-grid{display:grid;gap:16px}
.pg-arrow{width:56px;height:180px;border:2px solid var(--line2);border-radius:6px;background:none;font-size:26px}
.pg-arrow:hover:not(:disabled){border-color:#fff}
.pg-arrow:disabled{opacity:.2;cursor:default}
.pg-dots{height:10px;display:flex;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.dot.on{background:#fff}

/* ---------- パネル（モーダル） ---------- */
.modal{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.inbox,.cardget,.hand{background:var(--win);border:2px solid var(--line);border-radius:6px;text-align:center}
.inbox,.cardget{min-width:760px;max-width:1200px;padding:40px 56px;font-size:30px;line-height:1.6}
.inbox>.btn,.cardget>.btn{margin-top:28px;width:300px}
.inbox>.btnrow{margin-top:28px}
.in-title,.cg-title{font-size:32px;font-weight:700;margin-bottom:16px}
.inbox input{width:100%;height:80px;font-size:38px;text-align:center;border:2px solid var(--line);border-radius:6px;background:rgba(255,255,255,.08);color:#fff;font-family:var(--font)}
.cardget .card{margin:0 auto 20px}
.cg-desc{font-size:28px;margin-bottom:10px}
.cg-kw{font-size:22px;color:#c7cad6;margin-top:6px}
.cg-kw b{color:var(--gold)}
.pw{font-size:40px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
/* カード選択・カード一覧（中央のパネル） */
.hand,.inbox.wide{position:absolute;left:120px;right:120px;top:90px;bottom:56px;padding:30px 48px 32px;display:flex;flex-direction:column;align-items:center;max-width:none;min-width:0}
.hand-title,.inbox.wide .in-title{font-size:28px;font-weight:700;margin-bottom:8px}
.hand-quote{width:100%;padding:14px 24px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font-size:28px;line-height:1.5;margin-bottom:22px}
.hand-quote b{color:var(--gold);margin-right:8px}
.hand .pager,.inbox.wide .pager{margin-bottom:6px}
.hand-detail,.hv-detail{width:100%;min-height:96px;padding:14px 24px;border-top:1px solid var(--line2);font-size:26px;line-height:1.55;text-align:left}
.hand-detail b,.hv-detail b{margin-right:12px}
.hand .btnrow,.inbox.wide>.btn{margin-top:auto}

/* ---------- 議論 ---------- */
.witness{position:absolute;right:120px;bottom:calc(var(--box) + 120px);width:400px;height:400px}
.w-face{width:400px;height:400px;background:var(--win2);border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:260px}
.w-name{display:none}
.tnav{position:absolute;right:var(--m);bottom:calc(var(--box) + 52px);display:flex;gap:14px;z-index:7}
.tnav .btn{width:220px;min-width:0}
.tbox .tname{z-index:2}
.tbox.flip .ttext{animation:fade .25s}
.tbox.suspect{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tbox.suspect::before,.claim.suspect::before{content:"あやしい";position:absolute;top:-2px;right:120px;height:40px;line-height:40px;padding:0 18px;background:var(--gold);color:#0b0d12;font-size:22px;font-weight:700;border-radius:0 0 6px 6px}

/* ---------- 論破バトル ---------- */
.foe{position:absolute;right:120px;top:120px;width:400px;display:flex;flex-direction:column;align-items:center;gap:14px}
.foe-face{width:400px;height:400px;background:rgba(30,16,50,.7);border:2px solid rgba(200,160,255,.8);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:240px;box-shadow:0 0 40px rgba(155,77,255,.5)}
.foe-name{font-size:30px;font-weight:700;letter-spacing:.1em}
.gauge{display:flex;gap:8px;width:400px}
.seg{flex:1;height:16px;border-radius:3px;background:var(--red)}
.seg.off{background:rgba(255,255,255,.15)}
.claims{position:absolute;left:var(--m);top:200px;width:900px;display:flex;flex-direction:column;gap:22px}
.claim{position:relative;min-height:150px;text-align:left;padding:20px 40px;font-size:32px;line-height:1.55;font-weight:700;background:var(--win);border:2px solid var(--line);border-radius:6px}
.claim:hover{border-color:#fff;background:rgba(40,44,60,.85)}
.claim .q{color:var(--red)}
.claim.suspect{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}

/* ---------- まとめ ---------- */
.paper{position:absolute;left:120px;right:120px;top:200px;padding:56px 64px;background:var(--win);border:2px solid var(--line);border-radius:6px;font-size:38px;line-height:2.4;font-weight:700}
.paper p{margin:0}
.slot{min-width:260px;height:70px;padding:0 22px;margin:0 6px;border:2px dashed var(--gold);border-radius:6px;background:rgba(255,209,102,.08);font-size:32px;font-weight:700;vertical-align:middle;color:var(--gold)}
.slot.ok{border-style:solid;border-color:#fff;color:#fff;background:rgba(255,255,255,.12)}

/* ---------- 記憶のかけら ---------- */
#layer.frag{background:#06050a}
.frag-head{position:absolute;top:110px;width:100%;text-align:center;color:#d8cfee;font-size:44px;letter-spacing:.3em;animation:fade 1.2s}
.frag-pic{position:absolute;left:50%;top:200px;transform:translateX(-50%);width:720px;height:360px;border:2px solid rgba(200,180,255,.6);border-radius:6px;background:#120e1b;color:#d8cfee;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:96px;animation:fade 1.2s}
.frag-cap{font-size:26px;margin-top:12px;letter-spacing:.1em}
@keyframes fade{from{opacity:0}}

/* ---------- 演出 ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:100px;font-weight:900;letter-spacing:.06em;white-space:nowrap;color:#fff;animation:pop 1.4s forwards}
.big.ronpa{font-size:120px;text-shadow:0 0 30px rgba(255,77,94,.9),0 0 4px var(--red)}
.big.good{text-shadow:0 0 30px rgba(255,209,102,.9)}
.big.bad{color:#9aa0b4;text-shadow:0 0 20px #000}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}15%{transform:translate(-50%,-50%) scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.banner{position:absolute;left:0;right:0;top:40%;height:130px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--win);border-top:2px solid var(--line);border-bottom:2px solid var(--line);
  font-size:48px;font-weight:700;letter-spacing:.15em;animation:pop2 1.8s forwards}
.banner.tall{height:auto;padding:20px 0;line-height:1.45}
@keyframes pop2{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
#stage.shake{animation:shk .35s}
@keyframes shk{20%{margin-left:-12px}40%{margin-left:12px}60%{margin-left:-6px}80%{margin-left:6px}}
.warpfx{position:absolute;inset:0;background:radial-gradient(circle,rgba(200,140,255,0) 0,rgba(140,60,220,.75) 70%);animation:warpin 2.2s forwards}
@keyframes warpin{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#bg.warped svg{filter:hue-rotate(230deg) saturate(1.2) brightness(.65)}
.port.aura .pface,.witness.aura .w-face{border-color:#c79bff;box-shadow:0 0 40px 8px rgba(155,77,255,.7);animation:auraw 2.4s ease-in-out infinite}
@keyframes auraw{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- メニュー画面 ---------- */
.logo{position:absolute;left:0;right:0;top:110px;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.7)}
.logo-sub{font-size:30px;font-weight:700;letter-spacing:.4em}
.logo-main{font-size:120px;font-weight:900;letter-spacing:.08em;line-height:1.3}
.menu-col{position:absolute;left:50%;top:470px;transform:translateX(-50%);display:flex;flex-direction:column;gap:16px}
.menu-col .btn{width:440px}
.credit{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:18px;color:rgba(255,255,255,.75)}
.topbar{position:absolute;left:var(--m);right:0;top:28px;height:60px}
.topbar .btn{position:absolute;left:0;top:0;width:160px;min-width:0;height:60px;font-size:24px}
.topbar .btn.rt{left:auto;right:300px}
.topbar .spacer{display:none}
.topttl{position:absolute;right:0;top:0;height:60px;display:flex;align-items:center;padding:0 40px 0 48px;background:var(--win);border:2px solid var(--line);border-right:0;font-size:30px;font-weight:700;
  clip-path:polygon(24px 0,100% 0,100% 100%,24px 100%,0 50%)}
.epgrid{position:absolute;left:var(--m);right:var(--m);top:120px;bottom:40px;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:14px}
.eptile{background:var(--win);border:2px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.eptile:hover{border-color:#fff}
.eptile.locked{background:var(--win2);border-color:var(--line2);color:rgba(255,255,255,.4)}
.eptile.filler{visibility:hidden}
.eptile.notready:not(.locked){color:rgba(255,255,255,.6)}
.epno{font-size:20px;font-weight:700;color:var(--gold)}
.eptile.locked .epno{color:rgba(255,255,255,.4)}
.eptt{height:56px;display:flex;align-items:center;text-align:center;font-size:23px;font-weight:700;line-height:1.25}
.epst{height:28px;font-size:20px;color:var(--gold);letter-spacing:1px}
.zbody{position:absolute;left:120px;right:120px;top:120px;bottom:200px;display:flex;align-items:center;justify-content:center;background:var(--win);border:2px solid var(--line);border-radius:6px}
.zdetail{position:absolute;left:120px;right:120px;bottom:40px;height:140px;padding:20px 32px;background:var(--win);border:2px solid var(--line);border-radius:6px;font-size:28px;line-height:1.5}
.zdetail b{color:var(--gold);margin-right:12px}
.result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1000px;padding:48px 60px;background:var(--win);border:2px solid var(--line);border-radius:6px;text-align:center}
.result .btnrow{margin-top:32px}
.res-title{font-size:60px;font-weight:900;letter-spacing:.1em}
.res-star{font-size:84px;color:var(--gold);line-height:1.3}.res-star .off{color:rgba(255,255,255,.2)}
.res-note{font-size:24px;color:#c7cad6}
.res-pass{margin-top:22px;font-size:24px}.res-pass b{display:block;font-size:40px;letter-spacing:.1em;color:var(--gold)}
.cl-title{font-size:34px;font-weight:700}
table.cl{margin:16px auto;border-collapse:collapse;font-size:26px}
table.cl td{padding:6px 18px;border-bottom:1px solid var(--line2);text-align:left}
table.cl td.st{color:var(--gold)}
.cl-total{font-size:34px;font-weight:700;color:var(--gold)}
.settings{position:absolute;left:50%;top:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:16px}
.settings .btn{width:620px}
/* 調整 */
.foe{top:170px}
.claims{width:auto;right:560px}
.topbar .btn.rt{left:180px;right:auto}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="layer"></div>
  <div class="port" id="portL" hidden></div>
  <div class="port" id="portR" hidden></div>
  <div id="hud" hidden>
    <div id="hearts"></div>
    <div id="hudbtns">
      <button class="hudbtn" id="cardBtn" hidden>カード</button>
      <button class="hudbtn" id="hintBtn" hidden>ヒント</button>
      <button class="hudbtn" id="menuBtn">ちゅうだん</button>
    </div>
    <div id="tags"><div class="tag" id="tagNo"></div><div class="tag sub" id="tagTitle"></div></div>
  </div>
  <div id="catch" hidden></div>
  <div id="talk" hidden>
    <div class="tname"></div>
    <div class="ttext"></div>
    <button class="speak" title="読み上げ">🔊</button>
    <div class="next">▼</div>
  </div>
  <div id="modal" class="modal" hidden></div>

function parseScript(no, src) {

    if (l[0] === "@") {
      const [cmd, ...rest] = l.slice(1).trim().split(/\s+/); const arg = rest.join(" ");

      switch (cmd) {
        case "背景": ep.nodes.push({ t: "bg", bg: arg }); break;
        case "人物": { const [n, ic, side] = rest; ep.chars[n] = { icon: ic || "🙂", side: side || "R", col: "#6c8ead" }; break; }
        case "カード": block = { t: "cards" }; break;
        case "調査": add({ t: "inv", items: [], hint: "" }); break;
        case "まちがい探し": add({ t: "spot", items: [], hint: "" }); break;
        case "論破バトル": add({ t: "battle", rounds: [[]], hint: "" }); break;
        case "まとめ": add({ t: "sum", lines: [], hint: "" }); break;
        case "記憶のかけら": add({ t: "frag", title: arg, lines: [] }); break;
        case "クリア": ep.nodes.push({ t: "clear" }); break;
        case "ゆがみ": ep.nodes.push({ t: "warp", text: arg || "歴史が ゆがんだ！" }); break;
        case "ゆがめる": ep.nodes.push({ t: "warp", text: "歴史が ゆがんだ！", who: arg }); break;
        case "もどす": ep.nodes.push({ t: "restore", who: arg }); break;
        case "議論": add({ t: "testi", who: arg, rounds: [{ title: "", lines: [] }], hint: "" }); break;
        default: console.warn("不明な命令", cmd);
      }
      continue;
    }
    if (block) {
      if (block.t === "frag") { block.lines.push(parseDialog(l) || { who: "", expr: "", text: l.replace(/^-\s*/, "") }); continue; }
      if (/^ヒント[：:]/.test(l)) { block.hint = l.replace(/^ヒント[：:]\s*/, ""); continue; }

      if (block.t === "sum" && /^文[：:]/.test(l)) { block.lines.push(l.replace(/^文[：:]\s*/, "")); continue; }
      if (/^[-・]\s/.test(l)) {

  const t = { done: false };
  let i = 0, n = 0, timer = null;
  const end = () => { if (t.done) return; t.done = true; clearInterval(timer); units.forEach(u => u.classList.remove("tw-h")); onEnd && onEnd(); };
  t.finish = end;
  const step = () => {
    if (i >= units.length) return end();
    const u = units[i++]; u.classList.remove("tw-h");
    if (!/[\s、。！？…「」]/.test(u.textContent) && (n++ % 2 === 0)) blip();
  };
  timer = setInterval(step, SPEEDS[SAVE.opt.speed] || SPEEDS.normal);
  if (!units.length) end();
  return t;
}
function waitAdvance(typer) {
  return new Promise(res => {
    catcher.hidden = false;
    const go = () => {
      if (typer && !typer.done) { typer.finish(); return; }   // 表示中ならまず全部出す
      catcher.hidden = true; catcher.onclick = null; talk.onclick = null; document.removeEventListener("keydown", key); res();
    };
    const key = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    catcher.onclick = go; talk.onclick = e => { if (!e.target.closest(".speak")) go(); };
    document.addEventListener("keydown", key);
  });
}
async function say(who, expr, text, ep, opt = {}) {
  if (who === "トケイ") who = "";   // トケイは最終回まで話さない
  talk.hidden = false; talk.classList.toggle("dark", !!opt.dark);
  talk.querySelector(".tname").textContent = who && who !== "" ? who : "";
  talk.querySelector(".tname").hidden = !who;
  const tt = talk.querySelector(".ttext");
  tt.classList.toggle("narr", !who);
  talk.querySelector(".speak").onclick = e => { e.stopPropagation(); speak(text); };
  if (!opt.dark && !opt.noPort) showPortrait(who, expr, ep);
  if (SAVE.opt.autoRead) speak(text);
  talk.classList.add("typing");
  const typer = typeIn(tt, fmt(text), () => talk.classList.remove("typing"));
  await waitAdvance(typer);
  stopSpeak();
}

/* カードをページ送りで並べる（逆転裁判の法廷記録ふう。スクロールバーは使わない） */
function pager(names, opts) {
  const per = opts.perPage || 8, cols = opts.cols || 8;
  const wrap = h("div", "pager");
  const prev = h("button", "pg-arrow", "◀"), next = h("button", "pg-arrow", "▶");
  const grid = h("div", "pg-grid"); grid.style.gridTemplateColumns = `repeat(${cols}, var(--card-w))`;
  const dots = h("div", "pg-dots");
  const pages = Math.max(1, Math.ceil(names.length / per));
  let page = 0, selName = null;
  const draw = () => {
    grid.innerHTML = "";
    names.slice(page * per, page * per + per).forEach(n => {
      const e = cardEl(n, { unknown: opts.unknown && opts.unknown(n) });
      if (n === selName) e.classList.add("sel");
      e.onclick = () => { selName = n; grid.querySelectorAll(".card").forEach(c => c.classList.remove("sel")); e.classList.add("sel"); opts.onTap && opts.onTap(n); };
      grid.appendChild(e);
    });
    for (let k = grid.children.length; k < per; k++) grid.appendChild(h("div", "card blank"));   // 空きわくで大きさを固定
    prev.disabled = page === 0; next.disabled = page >= pages - 1;
    dots.innerHTML = pages > 1 ? Array.from({ length: pages }, (_, k) => `<span class="dot${k === page ? " on" : ""}"></span>`).join("") : "";
  };
  prev.onclick = () => { if (page > 0) { page--; draw(); } };
  next.onclick = () => { if (page < pages - 1) { page++; draw(); } };
  const row = h("div", "pg-row"); row.append(prev, grid, next);
  wrap.append(row, dots);
  draw();
  return wrap;
}

/* 手札からカードを選ぶ。キャンセルで null */
function chooseCard(title, correct, quote) {
  return new Promise(res => {
    let list = S.hand.slice();
    if (S.narrow) {
      // 議論・論破：その証言のまとまり全体で同じ3まい（どの証言で開いても同じなので、答えがばれない）
      if (S.narrowSet) list = S.narrowSet;
      else if (correct) list = S.narrowCache[correct] || (S.narrowCache[correct] = pick3(correct));
    }
    const box = h("div", "hand");
    if (quote) box.appendChild(h("div", "hand-quote", `<b>${esc(quote.who)}</b>「${fmt(quote.text)}」`));
    box.appendChild(h("div", "hand-title", fmt(title)));
    const detail = h("div", "hand-detail", "カードを えらぶと、説明が 出るよ");
    const btns = h("div", "btnrow");
    const ok = btn("つきつける！", "red", () => { if (sel) { closeModal(); res(sel); } });
    ok.disabled = true;
    let sel = null;
    const pg = pager(list, { perPage: 8, cols: 4, onTap: n => {   // 1回目のタップで説明を読む → 「つきつける！」で決定
      sel = n; ok.disabled = false;

}
function pick3(correct) {
  const others = S.hand.filter(n => n !== correct).sort(() => Math.random() - .5).slice(0, 2);

/* ---------- プレイ中の状態 ---------- */
let S = null;   // { no, ep, idx, hearts, hand, hint2, failed, narrow, hintLv, node }
const MAX_HEARTS = 5, RETRY_HEARTS = 3;
function renderHud() {
  hud.hidden = !S;
  if (!S) return;
  const hv = on => `<svg class="heart" viewBox="0 0 24 22"><path d="M12 21C-6 9 4-4 12 4C20-4 30 9 12 21Z" fill="${on ? "#d8392f" : "#3a322c"}" stroke="${on ? "#f4ead2" : "#6b5a45"}" stroke-width="1.6"/></svg>`;
  $("#hearts").innerHTML = Array.from({ length: MAX_HEARTS }, (_, i) => hv(i < S.hearts)).join("");
  $("#tagNo").textContent = S.no === 0 ? "プロローグ" : `第${S.no}話`;
  $("#tagTitle").textContent = S.ep.title.replace(/^(第\d+話|プロローグ)\s*/, "");
  const hb = $("#hintBtn"), n = S.node;
  const interactive = n && ["inv", "spot", "testi", "battle", "sum"].includes(n.t);
  hb.hidden = !interactive;
  const canJump = !!(S.hintCtx && S.hintCtx.jump);
  let label = "ヒント", dis = false;
  if (n && n.t !== "inv") {
    if (S.hintLv === 1) label = "しぼる ♡−1";
    else if (S.hintLv === 2 && canJump) label = "さらにしぼる ♡−1";
    else if (S.hintLv >= 2) { label = "しぼりこみ中"; dis = true; }
  }
  hb.textContent = label; hb.disabled = dis;
  $("#cardBtn").hidden = !S.hand.length;
}
/* 証言のまとまり（ラウンド）が変わるたびに、しぼりこみをリセット */
function newRound(ctx) {
  S.hintCtx = ctx || null; S.narrow = false; S.narrowSet = null; S.narrowCache = {};
  if (S.hintLv > 1) S.hintLv = 1;
  renderHud();
}
async function loseHeart(who, expr, msg) {
  S.hearts = Math.max(0, S.hearts - 1); shake(); renderHud();
  await say(who, expr, msg, S.ep);
  if (S.hearts <= 0) throw FAIL;
}
async function onHint() {
  if (!S || !S.node || S.busy) return;
  const n = S.node, ctx = S.hintCtx || {};
  S.busy = true;
  let fail = false;
  try {
    if (S.hintLv === 0 || n.t === "inv") {
      await say("本じい", "ふつう", n.hint || "教科書で キーワードを 調べてみるのじゃ", S.ep);
      S.hintLv = Math.max(S.hintLv, 1);
    } else if (S.hintLv === 1) {
      if (await confirmBox("♡を 1つ 使って、つきつける カードを<br><b>3まいに しぼりますか？</b>", "しぼる")) {
        S.hearts--; shake(); S.narrow = true; S.hintLv = 2;
        if (ctx.correct) S.narrowSet = pick3(ctx.correct);
        renderHud();
        await say("本じい", "ふつう", "よし、つきつける カードを 3まいに しぼってやろう", S.ep);
        if (S.hearts <= 0) fail = true;
      }
    } else if (S.hintLv === 2 && ctx.jump) {
      if (await confirmBox("♡を もう 1つ 使って、<br><b>あやしい ところを 教えて もらいますか？</b>", "教えてもらう")) {
        S.hearts--; shake(); S.hintLv = 3; renderHud();
        await say("本じい", "ふつう", "しかたないのう。あやしい ところに しるしを つけてやろう", S.ep);
        ctx.jump();
        if (S.hearts <= 0) fail = true;
      }
    }
  } finally { S.busy = false; hideTalk(); hidePortraits(); renderHud(); }
  if (fail && S.rej) S.rej(FAIL);
}

/* ---------- 場面：調査 ---------- */
function placeAt(e, pos) { e.style.left = pos[0] + "%"; e.style.top = pos[1] + "%"; }
function runInv(n) {
  return new Promise((res, rej) => {
    S.rej = rej;
    clearLayer(); hideTalk(); hidePortraits();
    const got = new Set(n.items.filter(it => S.hand.includes(it.card)).map(it => it.name));
    const info = h("div", "guide"); layer.appendChild(info);
    const upd = () => { info.innerHTML = `むらを 調べよう（のこり ${n.items.length - got.size}）`; };
    upd();
    n.items.forEach(it => {
      const e = h("button", "prop", `${iconHTML(it.icon)}<div class="plabel">${esc(it.name)}</div>`);
      placeAt(e, it.pos); if (got.has(it.name)) e.classList.add("done");
      e.onclick = async () => {
        if (S.busy) return; S.busy = true;
        try {
          // 「／」で区切って何行でも話せる。「名前：」で話す人を変える（＊はナレーション）
          const base = (S.ep.chars[it.name] || CHARS[it.name]) ? it.name : "";
          for (const seg of it.line.split(/\s*／\s*/)) {
            let who = base, text = seg;
            const m = seg.match(/^(.+?)[：:](.*)$/);
            if (/^[＊*]/.test(seg)) { who = ""; text = seg.replace(/^[＊*]\s*/, ""); }
            else if (m && (CHARS[m[1]] || S.ep.chars[m[1]])) { who = m[1]; text = m[2]; }
            await say(who, "ふつう", text, S.ep);
          }
          hideTalk(); hidePortraits();
          if (it.card && !S.hand.includes(it.card)) { S.hand.push(it.card); renderHud(); await showCardGet(it.card); }
          got.add(it.name); e.classList.add("done"); upd();
        } catch (er) { S.busy = false; return rej(er); }
        S.busy = false;
        if (got.size >= n.items.length) { await sleep(300); res(); }
      };
      layer.appendChild(e);
    });
    if (got.size >= n.items.length) res();
  });
}

/* ---------- 場面：まちがい探し（証言につきつける） ---------- */
function runSpot(n) {
  return new Promise((res, rej) => {
    clearLayer(); hideTalk(); hidePortraits();
    bgEl.classList.add("warped");
    const fixed = new Set();
    const bads = n.items.filter(i => i.bad).length;
    const info = h("div", "guide"); layer.appendChild(info);
    const upd = () => { info.innerHTML = `ゆがんだ 証言を 見やぶれ（のこり ${bads - fixed.size}）`; };
    upd();
    n.items.forEach((it, i) => {
      const e = h("button", "prop warped", `${iconHTML(it.icon)}${it.item ? `<div class="pitem">${it.item}</div>` : ""}<div class="plabel">${esc(it.name)}</div>`);
      placeAt(e, it.pos);
      e.onclick = async () => {
        if (S.busy || fixed.has(i)) return; S.busy = true;
        try {
          const pick = await chooseCard("この 証言と 矛盾する カードを つきつけろ！", it.bad ? it.card : null, { who: it.name, text: it.quote });
          if (pick && it.bad && pick === it.card) {
            fixed.add(i); bigText("矛盾 はっけん！", "ronpa"); shake(); await sleep(900);
            e.classList.remove("warped"); e.classList.add("fixed");
            const pi = e.querySelector(".pitem"); if (pi && it.fixItem) pi.textContent = it.fixItem;
            if (it.explain) await say("本じい", "笑顔", it.explain, S.ep);
            upd();
          } else if (pick && it.bad) {
            await loseHeart("ユガミ", "笑顔", "ハハハ、そのカードでは 矛盾して いないぞ！");
          } else if (pick) {
            await loseHeart("本じい", "おどろき", "むむ……その 証言は、この時代と 矛盾して いないようじゃ");
          }
          hideTalk(); hidePortraits();
        } catch (er) { S.busy = false; return rej(er); }
        S.busy = false;
        if (fixed.size >= bads) {
          await sleep(300);
          layer.querySelectorAll(".prop.warped").forEach(p => p.classList.remove("warped"));
          bgEl.classList.remove("warped"); bigText("ただしい 歴史に もどった！", "good"); await sleep(1300);
          res();
        }
      };
      layer.appendChild(e);
    });
  });
}

/* ---------- 場面：論破バトル ---------- */
function runBattle(n) {
  return new Promise((res, rej) => {
    S.rej = rej;
    let r = 0;
    const total = n.rounds.length;
    const draw = () => {
      clearLayer(); hideTalk(); hidePortraits();
      layer.className = "battle";
      const foe = h("div", "foe", `<div class="foe-face">${charOf("ユガミ").icon}</div><div class="foe-name">ユガミ</div>`);
      const gauge = h("div", "gauge", Array.from({ length: total }, (_, i) => `<span class="seg${i < total - r ? "" : " off"}"></span>`).join(""));
      foe.prepend(gauge); layer.appendChild(foe);
      layer.appendChild(h("div", "guide", `ユガミの ウソを 見やぶれ（${r + 1} / ${total}）`));
      const list = h("div", "claims");
      const claimEls = [];
      const lie = n.rounds[r].find(x => x.lie);
      newRound({ correct: lie && lie.card, jump: () => { const k = n.rounds[r].findIndex(x => x.lie); if (claimEls[k]) claimEls[k].classList.add("suspect"); } });
      n.rounds[r].forEach((c, i) => {
        const e = h("button", "claim", `<span class="q">「</span>${fmt(c.text)}<span class="q">」</span>`);
        e.onclick = async () => {
          if (S.busy) return; S.busy = true;
          try {
            const pick = await chooseCard("ウソだと 思ったら、矛盾する カードを つきつけろ！", c.lie ? c.card : null, { who: "ユガミ", text: c.text });
            if (pick && !c.lie) {
              await loseHeart("ユガミ", "笑顔", "フフ……それは ほんとうの ことだ。");
            } else if (pick) {
              if (pick === c.card) {
                bigText("論破！", "ronpa"); shake(); await sleep(900);
                if (c.reply) await say("ユウキ", "怒り", c.reply, S.ep);
                r++;
                if (r >= total) { S.busy = false; hideTalk(); return res(); }
                await say("ユガミ", "怒り", "くっ……まだだ！", S.ep);
                S.busy = false; return draw();
              } else {
                await loseHeart("ユガミ", "笑顔", "ハハハ！ そんな カードで オレの 歴史は くずせないぞ！");
              }
            }
            hideTalk(); hidePortraits();
          } catch (er) { S.busy = false; return rej(er); }
          S.busy = false;
        };
        claimEls.push(e); list.appendChild(e);
      });
      layer.appendChild(list);
    };
    draw();
  });
}

      layer.appendChild(box);
      const nav = h("div", "tnav");
      const prev = btn("◀ 前へ", "sub", () => go(-1));
      const pres = btn("つきつける！", "red", present);
      const next = btn("次へ ▶", "sub", () => go(1));
      box.onclick = e => { if (e.target.closest(".speak")) return; if (typer && !typer.done) typer.finish(); else go(1); };
      nav.append(prev, pres, next); layer.appendChild(nav);
      let typer = null;
      const show = () => {
        const line = round.lines[i];
        if (typer) typer.finish();
        typer = typeIn(box.querySelector(".ttext"), fmt(line.text));
        box.querySelector(".tcount").textContent = `${i + 1} / ${round.lines.length}`;
        box.classList.toggle("suspect", suspect && i === lieIdx);
        prev.disabled = i === 0;
        sp.onclick = () => speak(line.text);
        if (SAVE.opt.autoRead) speak(line.text);
        box.classList.remove("flip"); void box.offsetWidth; box.classList.add("flip");
      };
      const go = async d => {
        if (S.busy) return;
        if (d > 0 && i === round.lines.length - 1) {   // さいごの証言のあと：本じいが話して最初にもどる
          S.busy = true;
          try { await say("本じい", "ふつう", "証言は ここまでじゃ。矛盾は 見つかったかのう？ もう一度、最初から 聞いてみるのじゃ", S.ep); }
          finally { hideTalk(); hidePortraits(); S.busy = false; }
          i = 0; show(); return;
        }
        if (d < 0 && i === 0) return;
        i += d; show();
      };
      const lieIdx = round.lines.findIndex(x => x.lie);
      let suspect = false;
      newRound({ correct: round.lines[lieIdx] && round.lines[lieIdx].card, jump: () => { suspect = true; i = lieIdx; show(); } });
      async function present() {
        if (S.busy) return; S.busy = true;
        const line = round.lines[i];
        try {
          const pick = await chooseCard("この 証言と 矛盾する カードを つきつけろ！", line.lie ? line.card : null, { who, text: line.text });
          if (pick && line.lie && pick === line.card) {
            stopSpeak(); bigText("矛盾 はっけん！", "ronpa"); shake(); await sleep(1000);
            if (line.retort) await say("ユウキ", "怒り", line.retort, S.ep);
            if (line.reaction) await say(who, "おどろき", line.reaction, S.ep, { noPort: true });
            r++; i = 0;
            S.busy = false;
            if (r >= n.rounds.length) { hideTalk(); return res(); }
            return draw();
          } else if (pick) {
            await loseHeart("本じい", "おどろき", line.lie ? "むむ……その カードでは、矛盾を 説明 できんようじゃ" : "むむ……その 証言には、おかしな ところは ないようじゃ");
            hideTalk(); hidePortraits();
          }
        } catch (er) { S.busy = false; return rej(er); }
        S.busy = false;
      }
      show();
      banner("", `〜 証言 〜<br>${esc(round.title || "")}`);   // どの証言でも、はじめにタイトルを出す
    };
    draw(true);
  });
}

/* ---------- 場面：記憶のかけら ---------- */
async function runFrag(n) {
  clearLayer(); hideTalk(); hidePortraits(); hud.hidden = true;
  layer.className = "frag";
  const t = h("div", "frag-head", "一方 そのころ……");
  layer.appendChild(t); await sleep(1400);
  layer.appendChild(h("div", "frag-pic", `<div>🖼️</div><div class="frag-cap">記憶のかけら「${esc(n.title)}」</div>`));
  for (const l of n.lines) await say(l.who, l.expr, l.text, S.ep, { dark: true });
  hideTalk(); renderHud();
}

/* ---------- 話の進行 ---------- */
function checkpoint() {
  SAVE.resume = { no: S.no, idx: S.idx, hearts: S.hearts, hand: S.hand.slice(), aura: S.aura.slice(), hint2: S.hint2, failed: S.failed };
  persist();
}
async function playEpisode(no, resume) {
  const ep = EPS[no];
  S = { no, ep, idx: 0, hearts: MAX_HEARTS, hand: [], aura: [], hint2: false, failed: false, narrow: false, narrowSet: null, narrowCache: {}, hintCtx: null, hintLv: 0, node: null, busy: false };
  if (resume && SAVE.resume && SAVE.resume.no === no) Object.assign(S, SAVE.resume, { no, ep });
  // 再開時は直前の背景を復元
  let bg = EP_META[no][1];
  for (let i = 0; i < S.idx; i++) if (ep.nodes[i].t === "bg") bg = ep.nodes[i].bg;
  setBg(bg); if (S.aura.length) bgEl.classList.add("warped"); clearLayer(); renderHud();
  while (S.idx < ep.nodes.length) {
    const n = ep.nodes[S.idx];
    S.node = n; S.hintLv = 0; S.rej = null; newRound(null);
    const interactive = ["inv", "spot", "testi", "battle", "sum", "frag"].includes(n.t);
    if (interactive) checkpoint();
    const snap = { hand: S.hand.slice() };
    try {
      switch (n.t) {
        case "bg": setBg(n.bg); break;
        case "say": await say(n.who, n.expr, n.text, ep); break;
        case "inv": await runInv(n); break;
        case "spot": await runSpot(n); break;
        case "battle": await runBattle(n); break;
        case "sum": await runSum(n); break;
        case "frag": await runFrag(n); break;
        case "warp": await runWarp(n); break;
        case "restore": await runRestore(n); break;
        case "testi": await runTesti(n); break;
        case "clear": return finishEpisode();
      }
    } catch (e) {
      if (e === FAIL) {
        closeModal(); hideTalk(); S.busy = false;
        bigText("ゲームオーバー", "bad"); await sleep(1500);
        await say("本じい", "おどろき", "しっかりするのじゃ！ ♡3つで、この場面の 最初から やりなおすぞ", ep);
        S.hearts = RETRY_HEARTS; S.failed = true; S.hand = snap.hand; renderHud();
        continue;
      }
      throw e;
    }
    if (n.t !== "say" && n.t !== "bg") { hideTalk(); clearLayer(); }
    S.idx++;
  }
  return finishEpisode();
}
function finishEpisode() {
  bgEl.classList.remove("warped");
  hideTalk(); hidePortraits(); clearLayer();
  const no = S.no;
  // ★＝クリア時の♡の数。1度でもゲームオーバーになったら★1
  let star = S.failed ? 1 : Math.max(1, Math.min(MAX_HEARTS, S.hearts));
  if (no === 0) star = MAX_HEARTS;
  SAVE.stars[no] = Math.max(SAVE.stars[no] || 0, star);
  S.ep.cards.forEach(c => SAVE.cards[c] = 1);
  S.hand.forEach(c => SAVE.cards[c] = 1);
  SAVE.resume = null; persist();
  const ep = S.ep; S = null; renderHud();
  showResult(no, ep, star);
}

      if (!ready) return alertBox("この おはなしは じゅんび中です。");

        await alertBox("前の おはなしから 遊ぶのが おすすめだよ。");
      }
      if (SAVE.resume && SAVE.resume.no === no) {
        const box = h("div", "inbox"); box.appendChild(h("div", "in-msg", "とちゅうから つづけますか？"));
        const row = h("div", "btnrow");

  });
  for (let k = EP_META.length; k % 6; k++) grid.appendChild(h("div", "eptile filler"));   // 最後の段の空きをうめる
  layer.appendChild(grid);

}

  col.appendChild(tog("自動で 読み上げ", "autoRead"));

  col.appendChild(btn(`文字の 速さ：${SPN[SAVE.opt.speed] || "ふつう"}`, "", () => { SAVE.opt.speed = order[(order.indexOf(SAVE.opt.speed) + 1) % 3]; persist(); showSettings(); }));
  col.appendChild(tog("文字の 音（ぽぽぽ）", "blip"));
  col.appendChild(btn("ふっかつの じゅもんを 見る", "", () => alertBox(`いまの ふっかつの じゅもん<br><b class="pw">${makePassword()}</b><br><small>セーブが 消えたときに 使うよ。メモしておこう！</small>`)));

/* ---------- かいほうの じゅもん ---------- */
const normKana = s => (s || "").trim().replace(/\s+/g, "").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function fnv(s) { let x = 2166136261; for (const ch of "mh:" + s) { x ^= ch.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; } return x.toString(36); }
async function enterSpell() {
  const v = await inputBox("かいほうの じゅもんを 入れてね", "ひらがなで 入力");
  if (v == null) return;
  const hs = fnv(normKana(v));
  const no = (window.UNLOCK_HASHES || []).indexOf(hs);
  if (no > 0) {
    SAVE.unlocked = Math.max(SAVE.unlocked, no); persist();
    await alertBox(`じゅもんが ひかった！<br><b>第${no}話</b>まで ひらいたよ！`);
  } else await alertBox("じゅもんが ちがうようだ……");
}

/* ---------- ふっかつの じゅもん（開放＋★） ---------- */
const PW_MASK = [19, 7, 28, 3, 22, 11, 30, 14, 5, 25, 9, 17, 2, 27, 12];
const PW_LEN = 15;
const PW_CH = "あいうえおかきくけこさしすせそたちつてとなにのはひふへほまみむも"; // 32文字（見まちがえやすい字はのぞく）
function makePassword() {
  let v = BigInt(Math.min(SAVE.unlocked, 31));
  for (let i = 0; i < EP_COUNT; i++) v |= BigInt(Math.min(SAVE.stars[i] || 0, 7)) << BigInt(5 + i * 3);
  const digits = [];
  for (let i = 0; i < PW_LEN; i++) { digits.push(Number(v & 31n)); v >>= 5n; }
  const sum = digits.reduce((a, d, i) => (a + d * (i + 3)) % 32, 7);
  const s = [...digits.map((d, i) => d ^ PW_MASK[i]), sum].map(d => PW_CH[d]).join("");
  return s.slice(0, 4) + "・" + s.slice(4, 8) + "・" + s.slice(8, 12) + "・" + s.slice(12);
}
function readPassword(str) {
  const s = normKana(str).replace(/[・･\-ー]/g, "");
  if (s.length !== PW_LEN + 1) return null;
  const d = [...s].map(c => PW_CH.indexOf(c));
  if (d.some(x => x < 0)) return null;
  for (let i = 0; i < PW_LEN; i++) d[i] ^= PW_MASK[i];
  const sum = d.slice(0, PW_LEN).reduce((a, x, i) => (a + x * (i + 3)) % 32, 7);
  if (sum !== d[PW_LEN]) return null;
  let v = 0n; for (let i = PW_LEN - 1; i >= 0; i--) v = (v << 5n) | BigInt(d[i]);
  const unlocked = Number(v & 31n), stars = {};
  for (let i = 0; i < EP_COUNT; i++) { const s2 = Number((v >> BigInt(5 + i * 3)) & 7n); if (s2 > MAX_HEARTS) return null; if (s2) stars[i] = s2; }
  if (unlocked >= EP_COUNT) return null;
  return { unlocked, stars };
}
async function restoreFromPassword() {
  const v = await inputBox("ふっかつの じゅもんを 入れてね", "例：あいうえ・かきくけ・こさしす・せそた");
  if (v == null) return;
  const r = readPassword(v);
  if (!r) return alertBox("じゅもんが ちがうようだ……<br>もう一度 たしかめてね。");
  SAVE.unlocked = Math.max(SAVE.unlocked, r.unlocked);
  for (const k in r.stars) {
    SAVE.stars[k] = Math.max(SAVE.stars[k] || 0, r.stars[k]);
    if (EPS[k]) EPS[k].cards.forEach(c => SAVE.cards[c] = 1);
  }
  persist();
  await alertBox("ふっかつ した！");
  showSettings();
}

/* ---------- 起動 ---------- */
function boot() {
  stage = $("#stage"); layer = $("#layer"); bgEl = $("#bg"); talk = $("#talk"); catcher = $("#catch"); modal = $("#modal"); fx = $("#fx"); hud = $("#hud");
  for (const k in (window.SCENARIO_SRC || {})) EPS[k] = parseScript(Number(k), window.SCENARIO_SRC[k]);
  $("#hintBtn").onclick = onHint;
  $("#cardBtn").onclick = showHandViewer;
  $("#menuBtn").onclick = async () => {
    if (!S || S.busy) return;
    const box = h("div", "inbox"); box.appendChild(h("div", "in-msg", "おはなしを ちゅうだんしますか？<br><small>場面の はじめから 再開できます</small>"));
    const row = h("div", "btnrow");
    row.appendChild(btn("ちゅうだんする", "", () => { closeModal(); location.reload(); }));
    row.appendChild(btn("つづける", "sub", closeModal));
    box.appendChild(row); openModal(box);
  };
  addEventListener("resize", fit); fit();
  showTitle();
}
addEventListener("DOMContentLoaded", boot);
